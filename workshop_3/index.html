            scrollbar-width: none;

        }

            const data = slideData[index];
            let html = '';
            const startWrap = `<div class="content-safe-area flex flex-col items-center justify-center w-full px-2 py-4">`;
            const endWrap = `</div>`;

            switch(data.type) {
                case 'title':
                    html = `
                        <div class="slide active flex-col items-center text-center max-w-4xl">
                            <h1 class="text-3xl sm:text-5xl md:text-7xl font-extrabold mb-4 md:mb-8 tracking-tighter ${data.accent ? 'text-gradient' : 'text-purple-900'}">
                                ${data.title}
                            </h1>
                            <p class="text-base sm:text-xl md:text-2xl text-slate-500 font-medium mb-6 md:mb-12">
                                ${data.subtitle}
                            </p>
                            <div class="inline-block px-4 py-2 bg-orange-100 text-orange-600 rounded-full font-bold text-[10px] md:text-sm">
                                ${data.extra}
                            </div>
                        </div>
                    `;
                    break;
                case 'section':
                    html = `
                        <div class="slide active flex-col items-center text-center">
                            <span class="text-orange-500 font-bold text-lg md:text-2xl mb-2 uppercase">${data.number}</span>
                            <h2 class="text-4xl sm:text-6xl md:text-8xl font-black text-purple-900 tracking-tight">${data.title}</h2>
                        </div>
                    `;
                    break;
                case 'list':
                    html = `
                        <div class="slide active flex-col items-start max-w-4xl w-full">
                            <div class="flex items-center gap-3 mb-4 md:mb-8 w-full">
                                <div class="p-2 md:p-3 bg-purple-50 rounded-xl text-purple-600 shrink-0">
                                    <i data-lucide="${data.icon}" class="w-5 h-5 md:w-8 md:h-8"></i>
                                </div>
                                <h2 class="text-lg sm:text-2xl md:text-4xl font-bold text-slate-900 leading-tight">${data.title}</h2>
                            </div>
                            ${startWrap}
                            <ul class="space-y-3 md:space-y-4 w-full">
                                ${data.items.map(item => `
                                    <li class="flex items-center gap-3 text-sm sm:text-lg md:text-xl text-slate-700 bg-slate-50 p-4 md:p-5 rounded-xl border border-slate-100 w-full">
                                        <i data-lucide="check" class="text-orange-500 w-4 h-4 md:w-5 md:h-5 shrink-0"></i>
                                        <span>${item}</span>
                                    </li>
                                `).join('')}
                            </ul>
                            ${data.footer ? `<p class="mt-4 md:mt-8 text-xs md:text-xl font-semibold text-purple-600 italic text-center w-full">"${data.footer}"</p>` : ''}
                            ${endWrap}
                        </div>
                    `;
                    break;
                case 'quote':
                    html = `
                        <div class="slide active flex-col items-center text-center max-w-4xl">
                            <div class="p-3 bg-${data.color === 'orange' ? 'orange' : 'purple'}-50 rounded-full text-${data.color === 'orange' ? 'orange' : 'purple'}-600 mb-4 md:mb-6">
                                <i data-lucide="${data.icon}" class="w-8 h-8 md:w-12 md:h-12"></i>
                            </div>
                            <h3 class="text-[10px] md:text-2xl font-bold text-slate-400 mb-2 md:mb-4 uppercase tracking-widest">${data.title}</h3>
                            <p class="text-lg sm:text-2xl md:text-4xl font-semibold text-slate-800 leading-tight">
                                ${data.text}
                            </p>
                            <p class="text-xl sm:text-3xl md:text-5xl font-black mt-2 md:mt-6 text-${data.color === 'orange' ? 'orange' : 'purple'}-600">
                                ${data.highlight}
                            </p>
                        </div>
                    `;
                    break;
                case 'comparison':
                    html = `
                        <div class="slide active flex-col items-center max-w-5xl w-full">
                            <h2 class="text-xl md:text-4xl font-bold mb-6 md:mb-12 text-center text-purple-900">${data.title}</h2>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-8 w-full">
                                <div class="p-5 md:p-8 rounded-xl md:rounded-3xl border-2 border-slate-100 bg-white shadow-sm">
                                    <p class="text-sm md:text-2xl font-bold text-slate-400 text-center">${data.bad.title}</p>
                                </div>
                                <div class="p-5 md:p-8 rounded-xl md:rounded-3xl border-2 border-purple-200 bg-purple-50 shadow-xl shadow-purple-100">
                                    <p class="text-sm md:text-2xl font-bold text-purple-600 text-center">${data.good.title}</p>
                                </div>
                            </div>
                        </div>
                    `;
                    break;
                case 'text':
                    html = `
                        <div class="slide active flex-col items-center text-center max-w-4xl">
                            <div class="p-3 md:p-4 bg-${data.color}-50 rounded-xl md:rounded-2xl text-${data.color}-600 mb-4 md:mb-8">
                                <i data-lucide="${data.icon}" class="w-8 h-8 md:w-12 md:h-12"></i>
                            </div>
                            <h2 class="text-xl sm:text-3xl md:text-5xl font-bold text-slate-900 mb-4 md:mb-6 leading-tight">${data.title}</h2>
                            <p class="text-sm sm:text-xl md:text-2xl text-slate-600 mb-4 md:mb-8 leading-relaxed">${data.text}</p>
                            <div class="h-1 w-12 md:w-20 bg-orange-500 mb-4 md:mb-8 mx-auto"></div>
                            <p class="text-xs md:text-2xl font-bold text-purple-600 uppercase tracking-tight">${data.subtext}</p>
                        </div>
                    `;
                    break;
            }

            main.innerHTML = html;
            lucide.createIcons();
            
            const progressPercent = ((index + 1) / slideData.length) * 100;
            progress.style.width = `${progressPercent}%`;
            counter.innerText = `${index + 1} / ${slideData.length}`;
        }

        function nextSlide() {
            if (currentSlide < slideData.length - 1) {
                currentSlide++;
                renderSlide(currentSlide);
            }
        }

        function prevSlide() {
            if (currentSlide > 0) {
                currentSlide--;
                renderSlide(currentSlide);
            }
        }

        document.getElementById('nextBtn').addEventListener('click', nextSlide);
        document.getElementById('prevBtn').addEventListener('click', prevSlide);

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
        });

        // Жесты (свайп)
        let touchstartX = 0;
        let touchendX = 0;
        document.addEventListener('touchstart', e => { touchstartX = e.changedTouches[0].screenX; });
        document.addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            if (touchendX < touchstartX - 50) nextSlide();
            if (touchendX > touchstartX + 50) prevSlide();
        });

        renderSlide(currentSlide);
    </script>
</body>
</html>
