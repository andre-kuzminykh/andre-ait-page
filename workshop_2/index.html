    <style>
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            background-color: #ffffff;
            height: 100vh;
            width: 100vw;
        }
        /* Анимация переходов */
        .slide {
            display: none;
            animation: fadeIn 0.4s ease-out;
        }
        .slide.active {
            display: flex;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .text-gradient {
            background: linear-gradient(135deg, #7c3aed 0%, #f97316 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .progress-bar {
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        /* Ограничение высоты контента для мобилок */
        .content-safe-area {
            max-height: calc(100vh - 160px); /* Увеличил запас для безопасности */
            overflow-y: auto;
            scrollbar-width: none;
            width: 100%;
        }
        .content-safe-area::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>

                                <i data-lucide="${data.icon}" class="w-8 h-8 md:w-12 md:h-12"></i>
                            </div>
                            <h2 class="text-xl sm:text-3xl md:text-5xl font-bold text-slate-900 mb-4 md:mb-6 leading-tight">${data.title}</h2>
                            <p class="text-sm sm:text-xl md:text-2xl text-slate-600 mb-4 md:mb-8 leading-relaxed">${data.text}</p>
                            <div class="h-1 w-12 md:w-20 bg-orange-500 mb-4 md:mb-8 mx-auto"></div>
                            <p class="text-xs md:text-2xl font-bold text-purple-600 uppercase tracking-tight">${data.subtext}</p>
                        </div>
                    `;
                    break;
            }

            main.innerHTML = html;
            lucide.createIcons();
            
            const progressPercent = ((index + 1) / slideData.length) * 100;
            progress.style.width = `${progressPercent}%`;
            counter.innerText = `${index + 1} / ${slideData.length}`;
        }

        function nextSlide() {
            if (currentSlide < slideData.length - 1) {
                currentSlide++;
                renderSlide(currentSlide);
            }
        }

        function prevSlide() {
            if (currentSlide > 0) {
                currentSlide--;
                renderSlide(currentSlide);
            }
        }

        document.getElementById('nextBtn').addEventListener('click', nextSlide);
        document.getElementById('prevBtn').addEventListener('click', prevSlide);

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
        });

        // Жесты для мобилок (swipe)
        let touchstartX = 0;
        let touchendX = 0;
        
        function handleGesture() {
          if (touchendX < touchstartX - 50) nextSlide();
          if (touchendX > touchstartX + 50) prevSlide();
        }

        document.addEventListener('touchstart', e => {
          touchstartX = e.changedTouches[0].screenX;
        });

        document.addEventListener('touchend', e => {
          touchendX = e.changedTouches[0].screenX;
          handleGesture();
        });

        renderSlide(currentSlide);
    </script>
</body>
</html>
