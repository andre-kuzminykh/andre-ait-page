<style>
  /* ============================================================
     Andre AIT — Course intro, STEP 1 of 3 (welcome.html).
     Single non-scrolling screen. Step 1 (hero) -> welcome-2.html
     (для кого) -> welcome-3.html (чему научитесь) -> /automation/main.
     The talking-head video auto-advances to the next screen when it ends.
     ============================================================ */
  :root{
    --bg:#050505; --fg:#E5E7EB; --muted:rgba(255,255,255,.55);
    --card-bg:rgba(255,255,255,.04); --card-border:rgba(255,255,255,.10); --card-shadow:none;
    --pill-bg:rgba(255,255,255,.06); --pill-border:rgba(255,255,255,.10);
    --divider:rgba(255,255,255,.20); --navitem:rgba(255,255,255,.60);
    --btn-bg:#FAFAFA; --btn-fg:#050505;
    --ctrl-bg:rgba(255,255,255,.05); --ctrl-border:rgba(255,255,255,.10); --ctrl-fg:rgba(255,255,255,.80);
  }
  html.light{
    --bg:#FAFAFA; --fg:#0A0A0A; --muted:rgba(10,10,10,.55);
    --card-bg:#fff; --card-border:rgba(0,0,0,.07); --card-shadow:0 1px 2px rgba(0,0,0,.04);
    --pill-bg:rgba(255,255,255,.7); --pill-border:rgba(0,0,0,.10);
    --divider:rgba(0,0,0,.20); --navitem:rgba(0,0,0,.55);
    --btn-bg:#0A0A0A; --btn-fg:#FAFAFA;
    --ctrl-bg:rgba(0,0,0,.03); --ctrl-border:rgba(0,0,0,.10); --ctrl-fg:rgba(0,0,0,.70);
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--fg); overflow:hidden;
    transition:background .25s ease,color .25s ease;
    font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,monospace;
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3{letter-spacing:-.02em;margin:0}
  ::selection{background:#8854F3;color:#fff}
  a{text-decoration:none;color:inherit}
  button{font-family:inherit;cursor:pointer}
  *:focus-visible{outline:2px solid #8854F3;outline-offset:2px}
  .plum{color:#8854F3}
  .flame{color:#F97316}

  @keyframes gradientShimmer{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes floatY{0%{transform:translateY(0)}50%{transform:translateY(-9px)}100%{transform:translateY(0)}}
  @keyframes press{0%{transform:scale(1)}45%{transform:scale(.94)}100%{transform:scale(1)}}

  /* ===== Grain overlay (same as main site) ===== */
  .grain{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:.06;mix-blend-mode:screen;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    background-size:180px 180px}

  /* ===== Header: transparent, floating ===== */
  header{position:fixed;inset:0 0 auto 0;z-index:40;pointer-events:none}
  .row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.75rem;padding:1.1rem}
  @media(min-width:1024px){.row{padding:2rem}}
  .row>*{pointer-events:auto}

  .logo-btn{display:inline-flex;align-items:center;gap:.5rem;background:none;border:0;padding:0;justify-self:start;cursor:pointer}
  .logo-btn img{height:clamp(2.85rem,12vw,3.7rem);width:auto;object-fit:contain;transition:transform .2s ease;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
  @media(min-width:1024px){.logo-btn img{height:3.6rem}}
  .logo-btn:hover img{transform:scale(1.05)}


  .right{grid-column:3;display:flex;align-items:center;justify-self:end;gap:.5rem}
  @media(min-width:640px){.right{gap:.75rem}}
  .ctrl{display:inline-flex;align-items:center;justify-content:center;height:clamp(2.5rem,11vw,3.3rem);width:clamp(2.5rem,11vw,3.3rem);border-radius:999px;border:1px solid var(--ctrl-border);background:var(--ctrl-bg);color:var(--ctrl-fg);font-size:clamp(1.15rem,3.6vw,1.4rem);line-height:1;flex-shrink:0;transition:background .2s ease}
  @media(min-width:1024px){.ctrl{height:2.85rem;width:2.85rem;font-size:1.1rem}}
  .ctrl:hover{background:rgba(255,255,255,.10)}

  /* ===== CTA button: white, shimmer gradient on hover (same as site) ===== */
  .btn-white{
    display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border:0;
    border-radius:999px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;
    background:var(--btn-bg);color:var(--btn-fg);box-shadow:0 4px 15px rgba(0,0,0,.18);
    transition:all .3s ease;white-space:nowrap;
  }
  .btn-white:hover{
    background:linear-gradient(100deg,#8854F3 0%,#F97316 50%,#8854F3 100%);background-size:250% 250%;
    color:#fff;box-shadow:0 10px 25px -5px rgba(136,84,243,.45);transform:translateY(-2px);
    animation:gradientShimmer 4.5s ease infinite;
  }
  /* auto-press feedback when the video finishes and the next step opens */
  .btn-white.pressed{
    background:linear-gradient(100deg,#8854F3 0%,#F97316 50%,#8854F3 100%);background-size:250% 250%;
    color:#fff;box-shadow:0 10px 25px -5px rgba(136,84,243,.45);
    animation:gradientShimmer 4.5s ease infinite, press .42s ease;
  }
  .consult{height:clamp(2.5rem,11vw,3.3rem);padding:0 clamp(1rem,2.2vw,1.6rem);font-size:clamp(10px,1.05vw,12.5px)}
  @media(min-width:1024px){.consult{height:3.1rem;padding:0 1.8rem;font-size:16px;letter-spacing:.13em}}
  /* large screens: scale the whole UI up (like the main site) */
  @media(min-width:1600px){body{zoom:1.15}}
  @media(min-width:1900px){body{zoom:1.3}}
  @media(min-width:2300px){body{zoom:1.5}}

  /* ===== Content: single non-scrolling screen, centred ===== */
  main{height:100dvh;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5rem 1rem}
  @media(min-width:640px){main{padding:5.5rem 2rem}}
  /* body{zoom} scales 100dvh taller than the screen → correct the height so content stays vertically centred */
  @media(min-width:1600px){main{height:calc(100dvh / 1.15)}}
  @media(min-width:1900px){main{height:calc(100dvh / 1.3)}}
  @media(min-width:2300px){main{height:calc(100dvh / 1.5)}}
  .wrap{width:100%;max-width:62rem;margin:0 auto;text-align:center;animation:fadeUp .5s ease both}

  .hero{font-size:clamp(1.4rem,4.6vw,2.8rem);font-weight:800;text-transform:uppercase;line-height:1.12;letter-spacing:-.02em;padding-top:.5rem}
  .hero span.line{display:block}
  .hero .nowrap{display:block}
  .hero .plum,.hero .flame{white-space:nowrap}
  .desc{color:var(--muted);max-width:40rem;margin:1.5rem auto 0;font-size:clamp(14.5px,1.05vw,21px);line-height:1.6}

  /* decorative floating icon tiles above the hero */
  .float-row{display:flex;justify-content:center;align-items:flex-end;gap:.85rem;transform:scale(.82);margin:0 0 .25rem}
  @media(min-width:640px){.float-row{transform:none;margin-bottom:.85rem}}
  .tile{flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#15151b;border-radius:1rem;animation:floatY 4s ease-in-out infinite}
  .tile.sm{width:3.6rem;height:5.4rem;gap:.55rem}
  .tile.lg{width:4.5rem;height:6.6rem;gap:.6rem;border-radius:1.1rem}
  .tile .bar{height:3px;border-radius:2px}
  .tile.sm .bar{width:1.6rem}
  .tile.lg .bar{width:2rem}

  section.block{margin-top:0}
  .h2{text-align:center;font-size:1.65rem;font-weight:800;text-transform:uppercase;letter-spacing:-.02em}
  @media(min-width:1024px){.h2{font-size:clamp(2.1rem,2.3vw,2.8rem)}}

  .roles{margin-top:1.5rem;display:grid;grid-template-columns:1fr;gap:1rem}
  @media(min-width:640px){.roles{grid-template-columns:repeat(3,1fr)}}
  .card{border:1px solid var(--card-border);background:var(--card-bg);box-shadow:var(--card-shadow);border-radius:1rem;transition:transform .2s ease,border-color .2s ease}
  .card:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.18)}
  .role{padding:1.5rem;text-align:center;border-radius:1rem}
  .role .ico{margin:0 auto 1.1rem;display:inline-flex;align-items:center;justify-content:center;height:clamp(3.5rem,4.5vw,4.5rem);width:clamp(3.5rem,4.5vw,4.5rem);border-radius:1.1rem;font-size:clamp(1.5rem,2vw,2rem)}
  .ico.p{background:rgba(136,84,243,.15);color:#8854F3}
  .ico.f{background:rgba(249,115,22,.15);color:#F97316}
  .role h3{font-size:clamp(1rem,1.3vw,1.25rem);font-weight:700;text-transform:uppercase}
  .role p{color:var(--muted);margin:.5rem 0 0;font-size:clamp(.78rem,1vw,.95rem);line-height:1.6}

  .learn{margin-top:1.25rem;max-width:56rem;margin-left:auto;margin-right:auto;display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem;list-style:none;padding:0;text-align:left}
  .learn li{display:flex;align-items:center;gap:.7rem;padding:.7rem;border-radius:1rem;border:1px solid var(--card-border);background:var(--card-bg)}
  .learn .ico{height:clamp(2.2rem,3vw,2.8rem);width:clamp(2.2rem,3vw,2.8rem);border-radius:.6rem;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-size:clamp(1.05rem,1.4vw,1.35rem)}
  .learn p{margin:0;font-size:clamp(.8rem,1.3vw,.98rem);line-height:1.35}

  .cta-row{margin:2rem 0 0;display:flex;justify-content:center}
  .cta-row .btn-white{padding:clamp(.85rem,.85vw,1.35rem) clamp(1.7rem,1.7vw,2.7rem);font-size:clamp(11px,.78vw,16px);letter-spacing:.15em}

  /* ===== Video bubble (talking head): tap = sound / play-pause, draggable, auto-advance on end ===== */
  .bubble{position:fixed;left:clamp(1.5rem,5vw,4rem);bottom:clamp(1.5rem,5vh,3rem);z-index:40;width:clamp(140px,22vw,280px);height:clamp(140px,22vw,280px);touch-action:none;user-select:none;-webkit-user-select:none}
  @media(max-width:768px){.bubble{left:15px;bottom:15px;width:150px;height:150px}}
  .bubble .inner{position:relative;height:100%;width:100%;border-radius:999px;overflow:hidden;box-shadow:0 30px 80px -20px rgba(0,0,0,.6);outline:1px solid rgba(255,255,255,.2);cursor:grab}
  .bubble.dragging .inner{cursor:grabbing}
  .bubble .grad{position:absolute;inset:0;z-index:0;background:linear-gradient(135deg,#8854F3 0%,#F97316 100%)}
  .bubble video{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:cover}
  .bubble-sound{position:absolute;z-index:3;left:50%;bottom:8%;transform:translateX(-50%);display:inline-flex;align-items:center;justify-content:center;height:1.5rem;min-width:1.5rem;padding:0 .4rem;border-radius:999px;background:rgba(0,0,0,.45);color:#fff;font-size:.72rem;pointer-events:none;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);transition:opacity .2s ease}
  .bubble.paused .bubble-sound{opacity:0}
  .bubble-play{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.9rem;background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);opacity:0;transition:opacity .2s ease;pointer-events:none}
  .bubble.paused .bubble-play{opacity:1}


/* Теней нет нигде (требование заказчика): гасим и утилиты, и собственные стили */
*, *::before, *::after{ box-shadow:none !important; text-shadow:none !important; }
[class*="drop-shadow"]{ filter:none !important; }
.logo-btn img, header img{ filter:none !important; }


/* Говорящая голова — СПРАВА и того же размера, что в лекциях
   (там clamp(140px,13vw,190px) на десктопе и 100px на мобилке). */
.bubble{
  left:auto !important; right:20px !important;
  width:clamp(140px,13vw,190px) !important; height:clamp(140px,13vw,190px) !important;
}
@media(max-width:768px){
  .bubble{ left:auto !important; right:12px !important; width:100px !important; height:100px !important; }
}
</style>
</head>
<body>

  <div class="grain"></div>

  <!-- HEADER -->
  <header>
    <div class="row">
      <button class="logo-btn" aria-label="На главную" onclick="location.href='https://andre.technology'">
        <img src="https://i.ibb.co/gn7SmgY/866f2500-dd81-4d09-8c0f-2b55c25a3464-removalai-preview.png" alt="Andre AI">
      </button>

      <div class="right">
        <button class="ctrl" id="theme" aria-label="Сменить фон (тёмный/светлый)"><i class="fa-solid fa-sun"></i></button>
        <button class="btn-white consult" onclick="location.href='/automation/bootcamp/'" aria-label="Буткемп">
          Буткемп
          <i class="fa-solid fa-arrow-right" style="font-size:.75rem"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- STEP 2: ДЛЯ КОГО -->
  <main>
    <div class="wrap">
      <section class="block">
        <h2 class="h2">Для кого <span class="plum">этот курс</span></h2>
        <div class="roles">
          <article class="card role"><div class="ico p"><i class="fa-solid fa-compass"></i></div><h3>ИИ-консультант</h3><p>Находит процессы для ИИ-автоматизации</p></article>
          <article class="card role"><div class="ico f"><i class="fa-solid fa-wrench"></i></div><h3>ИИ-инженер по автоматизации</h3><p>Автоматизирует бизнес с ИИ-агентами</p></article>
          <article class="card role"><div class="ico p"><i class="fa-solid fa-rocket"></i></div><h3>ИИ-основатель</h3><p>Строит бизнес с помощью ИИ-агентов</p></article>
        </div>
      </section>
      <div class="cta-row">
        <button class="btn-white" id="next-btn" onclick="location.href='https://andre.technology/automation/skills'">
          Чему я научусь <i class="fa-solid fa-arrow-right" style="font-size:1rem"></i>
        </button>
      </div>
    </div>
  </main>

  <!-- VIDEO BUBBLE (talking head — drag to move; tap = sound/play-pause; auto-advances when it ends) -->
  <div class="bubble muted" id="bubble" title="Перетащите кружок · клик — звук/пауза">
    <div class="inner">
      <div class="grad"></div>
      <video id="bubble-video" src="/automation/roles/_2.mp4" muted autoplay playsinline preload="auto"></video>
      <div class="bubble-sound" id="bubble-sound" aria-hidden="true"><i class="fa-solid fa-volume-xmark"></i></div>
      <div class="bubble-play" aria-hidden="true"><i class="fa-solid fa-play"></i></div>
    </div>
  </div>


  <script>

    // ===== Theme / background switch (dark by default, .light when toggled) =====
    (function(){
      var root = document.documentElement;
      var btn  = document.getElementById('theme');
      if (!btn) return;
      function sync(){
        var light = root.classList.contains('light');
        btn.innerHTML = '<i class="fa-solid fa-' + (light ? 'moon' : 'sun') + '"></i>';
        var tc = document.querySelector('meta[name="theme-color"]');
        if (tc) tc.setAttribute('content', light ? '#FAFAFA' : '#050505');
      }
      btn.addEventListener('click', function(){
        root.classList.toggle('light');
        try { localStorage.setItem('welcome-theme', root.classList.contains('light') ? 'light' : 'dark'); } catch (e) {}
        sync();
      });
      sync();
    })();

    // ===== Video bubble: tap = sound/play-pause, drag, AUTO-ADVANCE to the next step when it ends =====
    (function(){
      var bubble  = document.getElementById('bubble');
      var video   = document.getElementById('bubble-video');
      var sound   = document.getElementById('bubble-sound');
      var nextBtn = document.getElementById('next-btn');
      if (!bubble || !video) return;

      // play once (NOT loop) so 'ended' fires
      video.loop = false;
      // ===== ONE journey-wide audio memory: once the user turns sound ON (step 1), every later
      // video (steps 2-3 + roadmap) starts WITH sound. Flag: localStorage('welcome-audio').
      // Browsers block UNMUTED autoplay on a fresh page without a gesture, so we try sound-on and
      // fall back to muted (one tap re-enables); on Chrome the domain's media engagement usually
      // lets the later pages start unmuted on their own. =====
      var WANT_SOUND = false;
      try { WANT_SOUND = localStorage.getItem('welcome-audio') === '1'; } catch (e) {}
      function rememberSound(){ try { localStorage.setItem('welcome-audio', '1'); } catch (e) {} }
      video.muted = !WANT_SOUND;
      // start ASAP; if we wanted sound but the browser blocked it, fall back to muted autoplay
      // Only the autoplay-policy block (NotAllowedError) means "sound isn't allowed on this fresh page"
      // → only THEN fall back to muted. Transient rejections (AbortError from an interrupted load) must
      // NOT mute, otherwise we'd kill sound the browser would actually allow (e.g. Chrome after the user
      // enabled sound earlier — media-engagement lets later pages start unmuted on their own).
      var soundBlocked = false;
      function tryPlay(){ var p = video.play && video.play(); if (p && p.catch) p.catch(function(err){ if (!video.muted && !soundBlocked && err && err.name === 'NotAllowedError'){ soundBlocked = true; video.muted = true; var q = video.play && video.play(); if (q && q.catch) q.catch(function(){}); } }); }
      tryPlay();
      video.addEventListener('loadedmetadata', tryPlay);
      video.addEventListener('loadeddata', tryPlay);
      video.addEventListener('canplay', tryPlay);
      function syncSound(){
        bubble.classList.toggle('muted', video.muted);
        if (sound) sound.innerHTML = '<i class="fa-solid fa-volume-' + (video.muted ? 'xmark' : 'high') + '"></i>';
      }
      video.addEventListener('play',  function(){ bubble.classList.remove('paused'); });
      video.addEventListener('pause', function(){ bubble.classList.add('paused'); });
      video.addEventListener('volumechange', syncSound);
      syncSound();
      // safety net: only if autoplay genuinely never started (rare with muted) show ▶ so the user can tap
      setTimeout(function(){ if (video.paused && video.currentTime < 0.1) bubble.classList.add('paused'); }, 2500);

      // когда говорящая голова договорила — авто-нажатие кнопки и переход на следующий экран
      var advanced = false;
      video.addEventListener('ended', function(){
        if (advanced || !nextBtn) return; advanced = true;
        nextBtn.classList.add('pressed');           // анимация нажатия
        setTimeout(function(){ nextBtn.click(); }, 150);
      });

      // tap: first turn the SOUND on (unmute — allowed inside the user gesture); then toggle play/pause
      function onTap(){
        if (video.muted){ video.muted = false; rememberSound(); try { video.currentTime = 0; } catch (e) {} var q = video.play(); if (q && q.catch) q.catch(function(){}); } // включили звук → видео с начала
        else if (video.paused){ var p2 = video.play(); if (p2 && p2.catch) p2.catch(function(){}); }
        else video.pause();
      }

      // body{zoom} scales fixed elements; reconcile rendered (clientX/rect) vs layout (style.left) px
      function zoomF(){ var r = bubble.getBoundingClientRect(); return (r.width && bubble.offsetWidth) ? r.width / bubble.offsetWidth : 1; }
      var down = false, moved = false, sx = 0, sy = 0, ox = 0, oy = 0, TH = 6;
      bubble.addEventListener('pointerdown', function(e){
        down = true; moved = false; sx = e.clientX; sy = e.clientY;
        var r = bubble.getBoundingClientRect(), z = zoomF();
        ox = r.left; oy = r.top;
        bubble.style.left = (r.left / z) + 'px'; bubble.style.top = (r.top / z) + 'px';
        bubble.style.right = 'auto'; bubble.style.bottom = 'auto';
        if (bubble.setPointerCapture) { try { bubble.setPointerCapture(e.pointerId); } catch (err) {} }
      });
      bubble.addEventListener('pointermove', function(e){
        if (!down) return;
        var dx = e.clientX - sx, dy = e.clientY - sy;
        if (!moved && (Math.abs(dx) > TH || Math.abs(dy) > TH)) { moved = true; bubble.classList.add('dragging'); }
        if (moved){
          var z = zoomF(), rw = bubble.offsetWidth * z, rh = bubble.offsetHeight * z;
          var nx = Math.min(Math.max(0, ox + dx), window.innerWidth  - rw);
          var ny = Math.min(Math.max(0, oy + dy), window.innerHeight - rh);
          bubble.style.left = (nx / z) + 'px'; bubble.style.top = (ny / z) + 'px';
        }
      });
      function endDrag(){
        if (!down) return; down = false;
        bubble.classList.remove('dragging');
        if (!moved) onTap();
      }
      bubble.addEventListener('pointerup', endDrag);
      bubble.addEventListener('pointercancel', endDrag);

      window.addEventListener('resize', function(){
        if (!bubble.style.left) return;
        var z = zoomF(), rw = bubble.offsetWidth * z, rh = bubble.offsetHeight * z;
        var lx = Math.max(0, Math.min(parseFloat(bubble.style.left) * z, window.innerWidth  - rw));
        var ly = Math.max(0, Math.min(parseFloat(bubble.style.top)  * z, window.innerHeight - rh));
        bubble.style.left = (lx / z) + 'px'; bubble.style.top = (ly / z) + 'px';
      });
    })();
  </script>

<script id="wizard-fit">
/* Экран визарда не листается по замыслу — три шага живут в одном экране.
   Но контент бывает выше вьюпорта, и тогда страница уезжает под фиксированную
   шапку: заголовок оказывается за кнопками. Ужимаем активный шаг, чтобы он
   помещался целиком, и держим его строго по центру. */
(function(){
  function fit(){
    var m = document.querySelector('main');
    var sec = document.querySelector('.screen.active') || document.querySelector('.screen');
    if(!m || !sec) return;
    sec.style.zoom = '';
    var st = getComputedStyle(m);
    var pad = (parseFloat(st.paddingTop)||0) + (parseFloat(st.paddingBottom)||0);
    var avail = window.innerHeight - pad;
    var need = sec.getBoundingClientRect().height;
    if(need > 8 && avail > 8 && need > avail) sec.style.zoom = Math.max(0.55, (avail/need) * 0.98);
  }
  var t;
  function soon(){ clearTimeout(t); t = setTimeout(fit, 60); }
  window.addEventListener('load', function(){ fit(); [200,600,1400].forEach(function(d){ setTimeout(fit,d); }); });
  window.addEventListener('resize', soon);
  window.addEventListener('orientationchange', function(){ setTimeout(fit,150); });
  window.addEventListener('popstate', soon);
  document.addEventListener('click', soon, true);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
