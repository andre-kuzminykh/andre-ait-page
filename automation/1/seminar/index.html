<style>
:root{
  --ink:#0A0A0A; --bg:#FFFFFF; --card:#FFFFFF; --bd:#E9E9E9;
  --muted:rgba(0,0,0,.58); --soft:rgba(0,0,0,.035); --soft-bd:rgba(0,0,0,.08);
  --pur:#8B5CF6; --org:#F97316;
  /* Акцент слайда — готовым набором, без color-mix: там, где его нет,
     подложка молча становится прозрачной и плитка теряет фон. */
  --ac:#8B5CF6; --ac-s:rgba(139,92,246,.13); --ac-m:rgba(139,92,246,.09);
  --ac-b:rgba(139,92,246,.26); --ac-l:rgba(139,92,246,.34);
  --scrim:rgba(10,10,10,.62);
  --view-scale:1;
  --form-w:1380px; --form-h:864px;
}
@media (max-width:767px){ :root{ --form-w:376px; --form-h:844px; } }
html.dark{
  --ink:#FAFAFA; --bg:#0A0A0A; --card:#141414; --bd:rgba(255,255,255,.13);
  --muted:rgba(250,250,250,.62); --soft:rgba(255,255,255,.05); --soft-bd:rgba(255,255,255,.10);
  --scrim:rgba(0,0,0,.74);
}
.acc-warm{ --ac:#F97316; --ac-s:rgba(249,115,22,.14); --ac-m:rgba(249,115,22,.10);
  --ac-b:rgba(249,115,22,.28); --ac-l:rgba(249,115,22,.36); }
*{margin:0;padding:0;box-sizing:border-box}
/* Теней нет нигде — общее требование по всем страницам курса */
*,*::before,*::after{box-shadow:none!important;text-shadow:none!important;filter:none!important}
html,body{height:100%;overflow:hidden;overflow:clip;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{
  font-family:'Montserrat',sans-serif; background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  transition:background .3s ease,color .3s ease;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit;cursor:pointer;background:none;border:none}
::selection{background:var(--pur);color:#fff}
*:focus{outline:none}
*:focus-visible{outline:2px solid var(--pur);outline-offset:3px}
.ic{width:1em;height:1em;fill:currentColor;flex-shrink:0;display:block}

/* ── Шапка: геометрия один в один с шапкой лекции ─────────────────────── */
#lecture-header{
  position:fixed; top:0; left:0; right:0; z-index:9000; display:flex;
  align-items:center; justify-content:space-between; gap:.5rem;
  padding:1.1rem; pointer-events:none; zoom:var(--view-scale,1);
}
@media (min-width:768px){ #lecture-header{ padding:2rem; } }
#lecture-header>*{pointer-events:auto}
.lec-logo{display:inline-flex;align-items:center;flex-shrink:0}
.lec-logo img{width:2.9rem;height:2.9rem;object-fit:contain;display:block}
@media (min-width:768px){ .lec-logo img{width:3.6rem;height:3.6rem} }
.lec-right{display:flex;align-items:center;gap:.4rem;flex-shrink:0}
.lec-ctrl{
  display:inline-flex;align-items:center;justify-content:center;height:2.7rem;width:2.7rem;
  border-radius:999px;border:1px solid var(--soft-bd);background:var(--card);color:var(--ink);
  font-size:1.05rem;line-height:1;transition:background .2s ease,color .2s ease,border-color .2s ease;
}
@media (min-width:768px){ .lec-ctrl{height:2.85rem;width:2.85rem;font-size:1.3rem} }
.lec-ctrl:hover{background:var(--soft);border-color:var(--pur)}
.lec-lbl{width:auto;padding:0 1.15rem;gap:.45rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;font-size:12px}
.lec-lbl .ic{font-size:1.2rem}
@media (max-width:767px){
  .lec-lbl{width:2.7rem;padding:0}
  .lec-lbl span{display:none}
  .lec-lbl .ic{font-size:1.05rem}
}
.lec-consult{
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.62rem .85rem;
  border-radius:999px;background:var(--pur);color:#fff;font-weight:800;text-transform:uppercase;
  letter-spacing:.06em;font-size:10.5px;white-space:nowrap;transition:background .2s ease;
}
@media (min-width:768px){ .lec-consult{height:2.85rem;box-sizing:border-box;padding:0 1.4rem;font-size:11.5px;letter-spacing:.15em;gap:.55rem} }
.lec-consult:hover{background:#7C3AED}

/* ── Сцена и холст ─────────────────────────────────────────────────────── */
/* Холст равен ФОРМЕ и центрируется; окно меняет только --view-scale. */
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#deck{
  position:relative; width:var(--form-w); height:var(--form-h); flex:0 0 auto;
  transform:translateX(var(--deck-shift,0px)) scale(var(--view-scale));
  transform-origin:center center;
}
body:not(.fit-ready) #deck{opacity:0}
.slide{
  position:absolute; inset:0; display:flex; flex-direction:column;
  padding:128px 40px 88px; opacity:0; visibility:hidden; pointer-events:none;
  transition:opacity .34s ease;
}
.slide.is-on{opacity:1;visibility:visible;pointer-events:auto}
@media (max-width:767px){ .slide{padding:88px 14px 96px} }

/* ── Заголовок слайда: значок и название, больше сверху ничего ────────── */
/* Раньше здесь были надпись «направление N из 10» и подводка на три строки.
   Слайд про сто ролей и так плотный: текст сверху съедал место у плиток,
   а место в колоде показывает счётчик внизу. */
.s-head{flex:0 0 auto;margin-bottom:16px;display:flex;align-items:center;gap:14px}
.s-ic{
  flex:0 0 auto; display:flex; align-items:center; justify-content:center;
  width:54px; height:54px; border-radius:17px; background:var(--ac-s);
  color:var(--ac); font-size:29px;
}
.s-title{
  font-size:44px;line-height:1.06;font-weight:900;letter-spacing:-.015em;
  background-image:linear-gradient(90deg,var(--pur) 0%,var(--org) 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
}
@media (max-width:767px){
  .s-head{margin-bottom:11px;gap:9px}
  .s-ic{width:34px;height:34px;border-radius:11px;font-size:19px}
  .s-title{font-size:23px;line-height:1.1}
}

/* ── Сетка плиток: 5x2 на компьютере, 2x5 на телефоне ──────────────────── */
.grid{
  flex:1 1 auto; display:grid; grid-template-columns:repeat(5,1fr);
  grid-auto-rows:1fr; gap:16px; min-height:0;
}
@media (max-width:767px){ .grid{grid-template-columns:repeat(2,1fr);gap:9px} }

.tile{
  position:relative; display:flex; flex-direction:column; align-items:stretch;
  text-align:left; justify-content:center; padding:18px; border-radius:18px;
  background:var(--card); border:1px solid var(--bd); overflow:hidden;
  transition:border-color .18s ease,background .18s ease;
}
.tile::after{
  content:''; position:absolute; left:0; right:0; bottom:0; height:3px;
  background:var(--ac); opacity:.16; transition:opacity .18s ease;
}
.tile:hover,.tile:focus-visible{border-color:var(--ac);background:var(--soft)}
.tile:hover::after,.tile:focus-visible::after{opacity:1}
/* Значок слева, название справа — заказчик просил именно такой порядок. */
.t-top{display:flex;align-items:center;gap:11px;width:100%}
.t-name{
  flex:1 1 auto; min-width:0; font-size:17px; line-height:1.18; font-weight:800;
  letter-spacing:-.005em;
  /* Слово посреди себя не рвём: «Производительнос-ть» — это дефект, а не
     перенос. Если слово не влезает, кегль подбирает fitNames() сразу для
     ВСЕХ плиток колоды, чтобы ряд не скакал. */
  overflow-wrap:normal; word-break:normal; hyphens:none;
}
.t-ic{
  flex:0 0 auto; display:flex; align-items:center; justify-content:center;
  width:48px; height:48px; border-radius:15px; background:var(--ac-s);
  color:var(--ac); font-size:26px;
}
.t-lead{margin-top:11px;font-size:12.5px;line-height:1.38;font-weight:500;color:var(--muted);overflow-wrap:break-word}
/* Три главные функции — нумерованными значками, а не точками: плитка сама
   читается как схема, без открытия карточки. */
.t-do{margin-top:13px;display:grid;gap:7px;width:100%;counter-reset:st}
.t-do i{
  display:flex; align-items:flex-start; gap:.55em; font-size:12px; line-height:1.32;
  font-style:normal; font-weight:600; color:var(--ink); opacity:.86;
}
.t-do i::before{
  counter-increment:st; content:counter(st); flex:0 0 auto;
  width:1.45em; height:1.45em; border-radius:6px; background:var(--ac-s);
  color:var(--ac); font-size:.85em; font-weight:800;
  display:flex; align-items:center; justify-content:center;
}
@media (max-width:767px){
  .tile{padding:11px 10px;border-radius:13px}
  .t-top{gap:7px}
  .t-name{font-size:12px;line-height:1.15}
  .t-ic{width:30px;height:30px;border-radius:9px;font-size:17px}
  .t-lead{margin-top:7px;font-size:9.5px;line-height:1.3}
  /* Три шага на телефон не помещаются — там остаются название, значок
     и подпись, а разбор работы открывается в карточке. */
  .t-do{display:none}
}

/* ── Стрелки, счётчик и полоса прогресса ───────────────────────────────── */
/* Всё это живёт в НИЖНЕЙ ПОЛОСЕ формы (88px на компьютере, 124px на
   телефоне) и масштабируется тем же множителем, что и холст. Поэтому
   стрелка не может налезть на плитку ни при каком окне: полоса пуста
   по построению, а панель стрелок ниже неё или ровно в ней.
   Размеры считаются в calc(), а не zoom: zoom у растянутого на всю
   ширину блока ломает центрирование. */
#deck-nav{
  position:fixed; left:0; right:0; bottom:0; z-index:8000; pointer-events:none;
  display:flex; align-items:center; justify-content:center;
  gap:calc(14px * var(--view-scale,1));
  height:calc(88px * var(--view-scale,1)); padding-bottom:3px;
}
@media (max-width:767px){ #deck-nav{ height:calc(96px * var(--view-scale,1)); } }
#deck-nav>*{pointer-events:auto}
.nav-arrow{
  width:calc(48px * var(--view-scale,1)); height:calc(48px * var(--view-scale,1));
  border-radius:999px; display:flex; align-items:center; justify-content:center;
  font-size:calc(20px * var(--view-scale,1));
  background:var(--card); border:1px solid var(--soft-bd); color:var(--ink);
  transition:background .2s ease,border-color .2s ease,color .2s ease;
}
.nav-arrow:hover{background:var(--pur);border-color:var(--pur);color:#fff}
#counter{
  font-size:calc(12px * var(--view-scale,1)); font-weight:800; letter-spacing:.12em;
  color:var(--muted); min-width:calc(64px * var(--view-scale,1)); text-align:center;
}
#progress{position:fixed;left:0;right:0;bottom:0;height:3px;background:var(--soft-bd);z-index:8000}
#progress-bar{height:100%;width:0;background:linear-gradient(90deg,var(--pur) 0%,var(--org) 100%);transition:width .34s ease}

/* ── Карточка сотрудника ───────────────────────────────────────────────── */
/* Карточка — оконный слой, а не содержимое слайда: она не масштабируется
   вместе с холстом. На компьютере обязана помещаться целиком без прокрутки
   (это стережёт tools/seminar_check.py), на телефоне листать вниз разрешено. */
#pop{position:fixed;inset:0;z-index:9600;display:flex;align-items:center;justify-content:center;padding:18px}
#pop[hidden]{display:none!important}
.pop-card:focus,.pop-card:focus-visible{outline:none}
.pop-scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .22s ease}
#pop.on .pop-scrim{opacity:1}
.pop-card{
  position:relative; width:min(880px,100%); max-height:min(88dvh,820px); overflow-y:auto;
  overscroll-behavior:contain; background:var(--card); border:1px solid var(--bd);
  border-radius:24px; padding:24px 24px 22px; opacity:0; transform:translateY(14px);
  transition:opacity .22s ease,transform .22s cubic-bezier(.22,1,.36,1);
  scrollbar-width:thin; scrollbar-color:var(--ac) transparent;
}
#pop.on .pop-card{opacity:1;transform:none}
.pop-card::-webkit-scrollbar{width:9px}
.pop-card::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--pur),var(--org));border-radius:999px;border:2px solid transparent;background-clip:padding-box}
.pop-x{
  position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:999px;
  display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--muted);
  border:1px solid transparent;transition:color .2s ease,border-color .2s ease;z-index:2;
}
.pop-x:hover{color:var(--ac);border-color:var(--soft-bd)}
/* Значок слева, название справа — как на плитках. */
.pop-head{display:flex;align-items:center;gap:16px;padding-right:48px}
.pop-id{flex:1 1 auto;min-width:0}
.pop-dom{
  font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ac);margin-bottom:5px;
}
.pop-name{font-size:27px;line-height:1.12;font-weight:900;letter-spacing:-.015em;overflow-wrap:break-word}
.pop-ic{
  flex:0 0 auto;display:flex;align-items:center;justify-content:center;width:64px;height:64px;
  border-radius:20px;font-size:34px;color:#fff;
  background:linear-gradient(135deg,var(--pur) 0%,var(--org) 100%);
}

/* Конвейер: вход → логика работы → выход. Это вся карточка, текста нет. */
.flow{margin-top:20px;display:grid;grid-template-columns:1fr 24px 1fr 24px 1fr;align-items:stretch}
.flow-col{padding:14px 14px 13px;border-radius:16px;background:var(--soft);border:1px solid var(--soft-bd);min-width:0}
.flow-col.mid{background:var(--ac-m);border-color:var(--ac-b)}
.flow-h{
  font-size:9.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);margin-bottom:10px;
}
.flow-col.mid .flow-h{color:var(--ac)}
.flow-col ul,.flow-col ol{list-style:none;display:grid;gap:7px;counter-reset:fs}
.flow-col li{
  display:flex;align-items:flex-start;gap:.55em;font-size:12.5px;line-height:1.32;
  font-weight:600;color:var(--ink);opacity:.88;overflow-wrap:break-word;
}
.flow-col ul li::before{
  content:'';flex:0 0 auto;width:5px;height:5px;border-radius:50%;
  background:var(--ac);margin-top:.45em;opacity:.7;
}
.flow-col ol li::before{
  counter-increment:fs;content:counter(fs);flex:0 0 auto;
  width:1.45em;height:1.45em;border-radius:6px;background:var(--ac);color:#fff;
  font-size:.82em;font-weight:800;display:flex;align-items:center;justify-content:center;
}
.flow-ar{display:flex;align-items:center;justify-content:center;color:var(--ac);font-size:19px;opacity:.85}

/* Что делает человек — отдельной полосой */
.row-human{
  margin-top:14px;display:flex;align-items:flex-start;gap:12px;padding:13px 15px;
  border-radius:16px;background:rgba(139,92,246,.10);border:1px solid rgba(139,92,246,.26);
}
.row-human .ic{font-size:20px;flex:0 0 auto;margin-top:1px;color:var(--pur)}
.row-t{font-size:9.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;margin-bottom:4px;opacity:.7}
.row-v{font-size:13px;line-height:1.45;font-weight:600}

/* Метрики — хэштегами внизу карточки */
.tags{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px 14px}
.tags span{font-size:12px;font-weight:700;color:var(--ac);opacity:.95;white-space:nowrap}

/* Плитка направления: вместо конвейера — состав из десяти ролей */
.roles{margin-top:20px;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:8px;counter-reset:rn}
.roles li{
  display:flex;align-items:center;gap:.6em;padding:10px 13px;border-radius:12px;
  background:var(--soft);border:1px solid var(--soft-bd);font-size:13px;font-weight:700;
  line-height:1.25;overflow-wrap:break-word;
}
.roles li::before{
  counter-increment:rn;content:counter(rn,decimal-leading-zero);flex:0 0 auto;
  font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--ac);opacity:.85;
}

.pop-nav{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:18px;padding-top:14px;border-top:1px solid var(--soft-bd)}
.pop-nav button{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:999px;border:1px solid var(--soft-bd);background:var(--soft);color:var(--ink);font-size:14px;transition:background .2s ease,border-color .2s ease,color .2s ease}
.pop-nav button:hover{background:var(--ac);border-color:var(--ac);color:#fff}
.pop-nav span{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--muted)}

@media (max-width:767px){
  #pop{padding:10px}
  .pop-card{width:100%;max-height:92dvh;padding:18px 15px 20px;border-radius:20px}
  .pop-head{gap:11px;padding-right:38px}
  .pop-ic{width:48px;height:48px;border-radius:15px;font-size:26px}
  .pop-name{font-size:19px}
  .pop-dom{font-size:9.5px;letter-spacing:.13em}
  .flow{margin-top:15px;grid-template-columns:1fr}
  .flow-ar{height:20px;transform:rotate(90deg)}
  .flow-col li{font-size:12px}
  .roles{grid-template-columns:1fr;margin-top:15px}
  .row-v{font-size:12.5px}
}

/* ── Панель «Текст к слайду»: дикторский текст семинара ────────────────── */
:root{--notes-w:clamp(340px,33vw,560px)}
#notes-panel{
  position:fixed;top:0;left:0;height:100dvh;width:var(--notes-w);z-index:9500;
  display:flex;flex-direction:column;background:var(--card);color:var(--ink);
  border-right:1px solid var(--bd);transform:translateX(-101%);visibility:hidden;
  transition:transform .38s cubic-bezier(.22,1,.36,1),visibility 0s linear .38s;
}
body.notes-open #notes-panel{transform:none;visibility:visible;transition:transform .38s cubic-bezier(.22,1,.36,1),visibility 0s}
@media (prefers-reduced-motion:reduce){#notes-panel{transition:none}}
.notes-head{
  flex:0 0 auto;display:flex;align-items:flex-start;justify-content:space-between;gap:.75rem;
  padding:calc((clamp(2.3rem,9vw,3.2rem) + clamp(1.5rem,5vw,2.3rem)) * var(--view-scale,1)) clamp(1rem,2.6vw,1.6rem) .85rem;
  border-bottom:1px solid var(--soft-bd);
  background:linear-gradient(180deg,rgba(139,92,246,.08),transparent);
}
#notes-close{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:2rem;height:2rem;font-size:1.25rem;color:var(--muted);transition:color .2s ease}
#notes-close:hover{color:var(--pur)}
.notes-meta{min-width:0;padding-top:.15rem}
.notes-counter{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--pur);margin-bottom:.3rem}
.notes-title{font-size:1.12rem;font-weight:800;line-height:1.28;overflow-wrap:break-word}
.notes-body{
  flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  padding:1.2rem clamp(1rem,2.6vw,1.6rem) 3rem;
  scrollbar-width:thin;scrollbar-color:var(--pur) transparent;
}
.notes-body::-webkit-scrollbar{width:9px}
.notes-body::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--pur),var(--org));border-radius:999px;border:2px solid transparent;background-clip:padding-box}
.notes-body p{margin:0 0 .95em;font-size:.94rem;line-height:1.72;color:var(--ink);opacity:.85;overflow-wrap:break-word}
.n-h{margin:1.5em 0 .7em;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--pur);display:flex;align-items:center;gap:.6rem}
.n-h::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(139,92,246,.35),transparent)}
.notes-body>*:first-child{margin-top:0}
.n-item{margin:0 0 .7rem;padding:.8rem .95rem;border-radius:.9rem;background:var(--soft);border:1px solid var(--soft-bd)}
.n-item .n-name{display:block;font-size:.8rem;font-weight:800;letter-spacing:.02em;color:var(--pur);margin-bottom:.35rem}
.n-item.alt{background:rgba(249,115,22,.08);border-color:rgba(249,115,22,.22)}
.n-item.alt .n-name{color:var(--org)}
.n-item p{margin:0;font-size:.9rem}
.n-lead{margin:0 0 1.1em;padding:.85rem 1rem;border-left:3px solid var(--org);border-radius:0 .7rem .7rem 0;background:rgba(249,115,22,.09)}
.n-lead p{margin:0}
@media (max-width:767px){
  #notes-panel{width:100%;border-right:none}
  .notes-body p{font-size:.88rem}
}
body.notes-open .nav-arrow{opacity:.35}
@media (max-width:767px){ body.notes-open .nav-arrow{display:none} }
</style>

    // в каком человек оставил лекцию. По умолчанию путь тёмный.

    apply(saved !== 'light');
  }
})();
</script>

<script id="slide-notes" type="application/json">[{"title":"Вступление: карта из 100 ролей","lead":"Слайд открывает семинар. Дальше — десять направлений по десять ролей.","paras":["Первая лекция закончилась, теперь переходим от общих принципов к конкретной карте. Сегодня разберем сто ИИ-сотрудников: десять направлений по десять ролей. Управление, люди, маркетинг, контент и соцсети, продажи, поддержка, аналитика, дизайн, разработка и инженерия.","Сразу договоримся, что я называю ИИ-сотрудником. Это не отдельный чат-бот, которого прикрутили к старому процессу. Это конкретный участок работы: есть вход, понятные шаги, результат, правила проверки и момент, где при необходимости подключается человек. Один сотрудник передает результат следующему, и из таких передач складывается работа целой компании.","Из этой сотни можно собрать, например, стартап-студию, которая запускает новые продукты один за другим. Меняется контекст и порядок запуска ролей, но сами процессы остаются теми же.","Есть важная граница. В эту сотню сознательно не входят финансовое и юридическое направления. При этом экономику продукта считать можно и нужно. Но официальный учет, налоги, договоры и решения с профессиональной ответственностью остаются за людьми.","Над всей сотней работает агент-оркестратор. Пользователь говорит, какой результат ему нужен, а оркестратор выбирает роли, собирает им контекст, запускает по порядку, вызывает человека на точках подтверждения и сохраняет результаты в общую память компании. Поэтому перед нами не просто список из ста карточек, а связанная операционная система. На каждом слайде дальше одна и та же логика: что получает роль, что делает, какой результат оставляет и где нужен человек. Начинаем с управления.","Из этих агентов вы можете выбрать нескольких, которых разработаете как итоговый проект курса, объединив их в сквозной процесс. Также вы можете выбрать свой процесс."],"items":[]},{"title":"Управление","lead":"Управление — это направление, в котором компания управляет сама собой. Здесь есть знания и документы, цели, задачи, процессы, проекты, продукт, календарь, коммуникации и команда. Все остальное в компании получает отсюда приоритеты и возвращает сюда результаты. Если этот слой не собран, автоматизация просто ускоряет хаос. Поэтому начинаем именно с него. На слайде десять ролей: каждая отвечает за свой участок управления и оставляет после себя результат, который можно передать дальше.","items":[{"ru":"Управление знаниями","text":"Управление знаниями — это одновременно память компании и универсальный сотрудник для документов. На вход идут документы, черновики, заметки, переписки и решения встреч. Агент может создать документ с нуля, отредактировать, структурировать, объединить несколько источников, сделать выжимку, сохранить версию и подготовить Markdown, DOCX или PDF. Параллельно он связывает материалы в общей базе знаний. Человек подтверждает главные источники и смысл важных правок. Утвержденный документ нельзя переписать незаметно: все изменения должны быть видны и обратимы."},{"ru":"Создание заметок","text":"Конспекты встреч слушают запись, расшифровку или голосовую заметку и превращают разговор в структуру. Агент выделяет решения, собирает действия, назначает ответственных и отделяет то, что обсуждали, от того, о чем договорились. Остается конспект, список решений, задачи с ответственными и открытые вопросы. Человек правит смысловые ошибки и спорные обязательства. Типичная ошибка тут одна: выдать чье-то предложение за решение команды. Дальше задачи уходят в управление задачами, а сроки в расписание."},{"ru":"Целеполагание","text":"Управление целями получает стратегию основателя, ограничения компании и текущие показатели. Оно уточняет формулировки, разбивает цели на уровни, связывает их с реальной работой и следит за отклонением. На выходе дерево целей, целевые значения, карта зависимостей и отчет о продвижении. Основатель утверждает цели и любое изменение стратегического приоритета: ИИ предлагает, но сам стратегические обязательства не переписывает. Работает в паре с управлением задачами, где цели превращаются в конкретную ежедневную работу."},{"ru":"Управление задачами","text":"Управление задачами превращает решения, цели и входящие запросы в понятные задачи. Оно формулирует задачу, убирает повторы, ставит срок, владельца и признак готовности, а затем напоминает о сроках. Остается живая очередь работы, где у каждой строки есть хозяин, и карта зависимостей. Человек разрешает спор о приоритете и подтверждает смену ответственного. Назначать людям обязательства без подтверждения агент не вправе, и плодить пять задач об одном и том же тоже."},{"ru":"Управление процессами","text":"Управление процессами начинается с бесед с участниками, журналов событий и следов работы над задачами. Агент восстанавливает, как работа идет на самом деле, сверяет рассказ с данными, находит узкие места и готовит новый порядок. Остаются две карты, как есть и как надо, роли, точки контроля и регламент. Владелец процесса подтверждает схему и границы самостоятельности агентов. Автоматизировать плохо понятый процесс нельзя: сначала проверка на данных, а не только на словах."},{"ru":"Управление проектами","text":"Управление проектами ведет ограниченные по времени начинания. На вход идут состав работ, сроки, команда, риски и зависимости. Агент строит план, считает критический путь, следит за блокерами и пересобирает сроки, когда реальность разошлась с планом. Остается план с этапами, сводка о состоянии и список блокеров. Человек утверждает компромисс между объемом и сроками и перенос ключевых дат. Прятать задержку сменой состояния запрещено: исходный план и все правки видны в истории."},{"ru":"Управление продуктами","text":"Управление продуктом смотрит на продукт как на систему ценности. Оно собирает свидетельства клиентов, данные о поведении и ограничения разработки, расставляет приоритеты, формулирует замыслы и потом проверяет, что изменилось в жизни людей. Остается замысел продукта, план развития, список приоритетов и проверяемые догадки. Основатель подтверждает крупные ставки. Главная ловушка здесь в подсчете голосов: число просьб от громких клиентов не заменяет свидетельство, а сделанное не равно изменению поведения."},{"ru":"Управление календарем","text":"Управление расписанием бережет самое невосполнимое, время основателя. Оно видит календарь, задачи, приоритеты и часовые пояса, ищет свободные окна, разводит наложения, бронирует блоки на сосредоточенную работу и заранее готовит повестку разговора. Остается собранное расписание, снятые наложения и напоминания о подготовке. Человек подтверждает внешние встречи, отмены и переносы с заметными последствиями. Внешнее обязательство агент сам не двигает, только по явному правилу или прямому подтверждению."},{"ru":"Управление коммуникациями","text":"Управление перепиской работает постоянно, а не по расписанию. Через него проходят почта, мессенджеры и внутренние чаты: агент разбирает поток, выделяет обещания, готовит черновики ответов и направляет обращения тем, кто разберется по существу. Остается разобранный ящик, краткие пересказы и повторные касания, чтобы обещанное не терялось. Человек утверждает чувствительные письма и обещания о цене. Отправлять рискованные сообщения от чужого имени без разрешения нельзя, это граница прав доступа."},{"ru":"Управление командой","text":"Управление командой держит ясность там, где ее проще всего потерять: роли, ответственность и загрузка людей и ИИ-агентов. Агент сверяет роли с реальной работой, считает загрузку, ищет пробелы владения и предлагает, кому что передать. Остается карта ответственности, обзор загрузки, план передачи дел и правила эскалации. Кадровые решения принимает руководитель. А непрозрачные поведенческие оценки не могут быть основанием для выводов о человеке и санкций."}]},{"title":"Люди","lead":"Дальше — люди. В этом направлении весь путь сотрудника: понять, кого вообще нужно нанять, найти кандидатов, отобрать, провести собеседование, ввести в работу, поддерживать, планировать график, развивать и оценивать результат. Здесь особенно важно не путать помощь ИИ с кадровым решением. Агент может собрать факты, сравнить с критериями и подготовить разговор, но решение о найме, повышении, компенсации или увольнении остается за человеком.","items":[{"ru":"Описание вакансии","text":"Описание вакансии берет на вход цели роли, настоящие процессы и задачи, нужные навыки и рамки вознаграждения. Оно превращает это в текст: обязанности, ожидаемый итог, отдельно обязательные требования и отдельно желательные, плюс шкалу оценки для будущих бесед. После него остается готовое описание роли и варианты публикации. Человек здесь нанимающий: он сверяет, что обязательные требования настоящие, а текст описывает ту работу, которая действительно есть."},{"ru":"Поиск кандидатов","text":"Поиск кандидатов получает описание роли, портрет нужного человека, географию и часовой пояс. Он идет по площадкам вакансий, профессиональным сетям и открытым источникам и собирает длинный список, где у каждого имени указан источник, доступность и доказательство соответствия. Рекрутер утверждает короткий список для обращения и проверяет, законно ли собраны данные. Ограничение жесткое: не ранжировать людей по защищенным признакам и не тянуть лишнее личное."},{"ru":"Скрининг резюме","text":"Отбор резюме получает резюме, портфолио, сделанные работы, описание роли и ту самую шкалу. Он сверяет опыт со шкалой, отделяет факты от предположений, вытаскивает выдержки-доказательства и честно помечает пробелы. На выходе короткий список и готовые вопросы к каждому кандидату. Отказ или продвижение подтверждает человек, особенно в пограничных случаях. Типичная ошибка тут одна: отсеять сильного человека за нестандартный путь, поэтому доказательство всегда лежит рядом с оценкой."},{"ru":"Интервью кандидатов","text":"Собеседование берет описание роли, шкалу, резюме и пробелы, оставшиеся после отбора. Оно собирает план беседы, ведет разговор по умениям и настоящим рабочим задачам, разбирает живой пример и фиксирует оценки. После него остается запись, заметки, оценки по умениям и рекомендация решения. Итог принимает нанимающий и вправе пересмотреть любую оценку. Судить по мимике и эмоциям запрещено, а о применении ИИ кандидату сообщают заранее."},{"ru":"Онбординг сотрудников","text":"Ввод в должность включается, когда решение принято. Он знает роль, дату выхода и список нужных прав, собирает план первых недель, заказывает доступы, выдает первые задачи и следит, кто где застрял. Остается план ввода, заявки на доступы, путь обучения и точки проверки. Руководитель подтверждает права и обязательные шаги по безопасности. Правило простое: выдавать минимально нужное, никакого доступа по шаблону без проверки роли."},{"ru":"Поддержка сотрудников","text":"Поддержка сотрудников — это дежурная точка помощи внутри компании. Сюда приходят с вопросами про правила, отпуска, процессы и инструменты. Она понимает суть запроса, находит ответ в правилах, дает готовую инструкцию, а сложное передает дальше и пополняет собрание частых ответов. Кадровый специалист забирает конфликты, оплату труда и дисциплинарные истории. И две границы: никаких юридических и медицинских заключений, данные сотрудника наружу не выходят."},{"ru":"График работы сотрудников","text":"График работы собирает доступность людей, правила, отпуска, потребности проектов и текущую нагрузку. Он составляет расписание смен, заранее показывает столкновения и незакрытые часы и сам предлагает, кто кого может подменить. Руководитель утверждает все, что задевает договор, переработки или отпуск. Работает в паре с благополучием сотрудников: одному видно расписание, второму видно, чем это оборачивается для человека. Подгонять график только под загрузку нельзя."},{"ru":"Благополучие сотрудников","text":"Благополучие сотрудников смотрит на рабочие признаки: нагрузку, переработки, отложенные отпуска, отклики самих людей. Замечает, что человек идет на перегруз, предлагает изменить условия и зовет на разговор. Остается не приговор, а повод поговорить честно и вовремя. Кадровые решения принимает только человек, а своими личными данными сотрудник распоряжается сам. Диагнозов здесь не ставят и скрытой оценки личности по косвенным наблюдениям не ведут."},{"ru":"Развитие сотрудников","text":"Развитие сотрудников работает уже с теми, кто в команде. На вход идут навыки роли, обратная связь о работе, цели самого человека и сделанные работы. Дальше появляется карта умений, найденные пробелы, план учебы, тренировочные задачи, наставник и понятные точки проверки продвижения. Цели развития подтверждают сотрудник и руководитель вместе. Серьезную аттестацию проводит живой проверяющий, а косвенные наблюдения не превращаются в вывод о потенциале."},{"ru":"Оценка результативности","text":"Оценка результативности замыкает круг. Она собирает цели периода, сделанную работу, отзывы коллег и шкалу роли, складывает доказательства в таблицу и сверяет их с ожиданиями, которые человек знал заранее. Остается черновик оценки, достижения, пробелы, план действий и повестка разговора. Итог, оплату, повышение или расставание определяет руководитель. ИИ здесь никогда не единственный судья, и каждый вывод опирается на доказательство, а не на общее ощущение."}]},{"title":"Маркетинг","lead":"Маркетинг отвечает на два базовых вопроса: кому нужен продукт и почему его должны выбрать. Сначала мы разбираемся с рынком, конкурентами и клиентами. Потом формулируем позиционирование, бизнес-модель и бренд, строим выход на рынок и путь клиента, а затем измеряем, что действительно работает. Эти десять ролей нужны до того, как мы начинаем масштабировать продвижение: иначе можно очень эффективно привлекать не тех людей и продвигать не то обещание.","items":[{"ru":"Анализ рынка","text":"Исследование рынка начинает всю цепочку. На вход оно берет идею, географию, ограничения и те данные, которые у компании уже есть. Дальше агент ищет источники, строит карту рынка, выделяет сегменты и превращает разрозненные наблюдения в проверяемые гипотезы. После него остается карта рынка, перечень категорий и тенденций, сигналы спроса и зоны свободных возможностей. Человек нужен в одной точке: он подтверждает границы рынка и стратегические выводы, а все слабое честно помечает как гипотезу."},{"ru":"Анализ конкурентов","text":"Анализ конкурентов забирает карту рынка и задачи клиента, чтобы выяснить, между чем человек на самом деле выбирает: между вами, прямыми соперниками, обходными решениями и привычкой ничего не менять. Агент сверяет цены и умения, находит сильные и слабые места, следит за изменениями. Остается таблица сравнения, свободные ниши и карточки для продаж. Спорные сравнительные заявления выпускает наружу только человек, и у каждого наблюдения обязательно стоит дата."},{"ru":"Изучение клиентов","text":"Изучение клиентов переводит разговор с рынка на живого человека. На вход идут гипотезы, доступ к клиентам и нынешние покупатели. Агент готовит план беседы, проводит опросы, сводит услышанное и проверяет, какие догадки выжили. На выходе сегменты и портреты, карта болей, поводы к покупке и возражения. Здесь важна жесткая граница: смоделированная беседа дает только гипотезу и никогда не заменяет разговор с настоящим клиентом. Отличить одно от другого обязан человек."},{"ru":"Позиционирование продукта","text":"Позиционирование получает на вход итоги изучения клиентов, сравнение с рынком, реальные возможности продукта и доказательства. Агент отвечает на четыре вопроса: для кого продукт, в какой категории его воспринимают, чем он отличается и почему в это можно поверить. Остается формула позиции, причины поверить и лестница сообщений, которой дальше пользуются бренд, продажи и содержание. Позицию и публичные заявления утверждает основатель. Обещать умение, которого у продукта нет, запрещено."},{"ru":"Бизнес-модель","text":"Бизнес-модель собирает экономическую модель продукта: кто платит, за что и как ценность создается и доставляется. На вход идут портрет клиента, ценностные обещания, каналы, затраты и гипотезы о цене. Агент описывает потоки денег, считает экономику сделки, ведет список допущений и планирует проверки. Получается схема модели, модель выручки и честный перечень того, что еще не подтверждено. Цену и денежные обязательства утверждает основатель, а модель остается гипотезой, пока ее не подтвердят сделки."},{"ru":"Брендбук","text":"Книга бренда превращает позицию в свод правил. На вход идут позиционирование, аудитория, замысел основателя и визуальные примеры. Агент пишет рассказ бренда, задает характер и тон речи, собирает внешний вид и правила именования, фиксирует версии. Написано все так, чтобы правилам одинаково следовали и люди, и генеративные ИИ-агенты. Ядро бренда закрыто на замок: генератор не меняет его самовольно. Имена и ключевые решения утверждает владелец бренда."},{"ru":"Стратегия выхода на рынок","text":"Стратегия выхода на рынок берет позицию, модель, портрет клиента и готовность продукта, а отдает план выхода: первый узкий сегмент, точку входа, каналы, способ продажи и воронку. Отдельно она ведет платное привлечение с ясными пределами расходов. Здесь у агента больше самостоятельности и заметно больше риска, поэтому правило жесткое: канал не усиливают, пока не доказана ценность, и агент сам никогда не поднимает расходы выше заданного предела."},{"ru":"Клиентский путь","text":"Карта пути клиента сшивает все вместе. На вход идут портрет клиента, беседы, данные воронки и обращения в поддержку. Агент собирает точки касания, отмечает трения, ищет моменты истины и назначает ответственного за каждый шаг. Остаются этапы пути, список трений и очередь улучшений. Типичная ошибка здесь — нарисовать красивый идеальный путь вместо фактического, поэтому текущее и желаемое состояние хранятся раздельно, а человек сверяет картину с реальными данными."},{"ru":"Маркетинговая аналитика","text":"Аналитика маркетинга отвечает на вопрос, что сработало и почему. Она сводит данные кампаний, расходы на рекламу, посещения, заявки и итоги проверок, считает воронку, сравнивает когорты и предлагает решения. После нее остаются дашборды, разбор воронки, оценка каналов и список рекомендаций. Определения показателей задает человек, он же проверяет утверждения о причинах. Совпадение и приписывание канала — это еще не причина, а пробелы в учете описываются прямо."},{"ru":"Голос клиента","text":"Голос клиента, в отличие от остальных, работает постоянно. Он слушает отзывы, обращения, записи звонков и опросы, собирает живые высказывания, группирует их по темам, следит за настроением и поднимает тревогу, когда появляется новая боль. Найденное он возвращает в изучение клиентов, в продукт и в поддержку, и цепочка замыкается. Придуманные цитаты запрещены: источник, сегмент и время сигнала сохраняются всегда. Что делать с сигналом, решает человек."}]},{"title":"Контент и соцсети","lead":"Контент и соцсети — это голос компании наружу. Здесь стратегия и бренд превращаются в конкретный поток материалов: выбираются каналы, строится контент-план, пишутся статьи и посты, создаются изображения и видео, материалы публикуются, комментарии обрабатываются, а реакция аудитории возвращается обратно в план. Это не фабрика постов ради охватов. Каждый материал должен вести к понятной цели и давать данные для следующего цикла.","items":[{"ru":"Анализ каналов","text":"Анализ каналов начинает цепочку. На вход он берет портрет клиента, позиционирование, данные площадок и активность соперников. Дальше сверяет аудиторию, сравнивает форматы, считает отдачу и назначает каждому каналу роль. После него остаются оценочная карта, ориентиры сравнения и ограничения выпуска. Человек нужен там, где само присутствие в канале создает репутационный или ресурсный риск. Типичная ошибка — выбрать канал ради пустого охвата, который никого не доводит до следующего шага."},{"ru":"Контент-план","text":"План публикаций получает книгу бренда, цели и новости продукта, наблюдения по каналам и портрет аудитории. Он собирает опоры тем, строит календарь выпусков, пишет задания создателям и заранее продумывает повторное использование материалов. На выходе рубрики, календарь, задания на материалы и план рассылок. Редактор утверждает острые темы, крупные повествования и очередность главных кампаний. Граница простая: план обязан меняться вслед за наблюдениями, а не превращаться в заполнение клеток ради заполнения."},{"ru":"Веб-блог","text":"Блог отвечает за длинные материалы сайта. Он берет исследование темы, задание, голос бренда и данные о продукте, собирает источники, выстраивает структуру, пишет черновик и готовит внутренние ссылки. Остаются готовая статья, описания для поиска и предложения обновить устаревшее. Редактор проверяет факты, ссылки и чувствительные утверждения до выхода статьи. Работает в паре с глубоким исследованием: для быстро меняющихся тем обязательны источник и дата факта, иначе выходит пустышка."},{"ru":"Генерация текста","text":"Генерация текстов — это ежедневный поток слов. На вход идут задание, книга бренда, исходные материалы и ограничения площадки. Агент разбирает задание, пишет черновик, готовит несколько вариантов заголовков и призывов и сверяет все с голосом бренда. Остаются записи, подписи, сценарии для видео и письма рассылок. Редактор утверждает рискованные публичные утверждения и окончательный текст для главных каналов. Самое жесткое ограничение: выдумывать факты и цитаты запрещено, все фактическое опирается на переданный источник."},{"ru":"Генерация изображений","text":"Генерация изображений работает по заданию и правилам бренда. Она уточняет описание, создает варианты, сверяет их со стилем и готовит размеры под каждую площадку. После нее остаются главные образы, обложки, карточки для соцсетей и сведения о том, как файл был создан, чтобы удачный результат можно было повторить. Дизайнер проверяет узнаваемость и права на изображения людей. Выдавать созданную картинку за документальную съемку нельзя."},{"ru":"Генерация видео","text":"Синтез видео берет сценарий, раскадровку, образцы кадров и требования к длительности и формату. Он пишет описания сцен, создает синтетические кадры и следит, чтобы облик героев не плыл от сцены к сцене. Остаются исходные сцены, варианты кадров и заметки о единстве. Человек проверяет сходство с реальными людьми и наличие согласий. Граница ответственности жесткая: агент снимает, но окончательный ролик не собирает, это уже соседняя роль."},{"ru":"Монтаж видео","text":"Монтаж видео — та самая соседняя роль. Он принимает исходные кадры, сценарий и звук, отбирает лучшее, собирает сборку, добавляет субтитры, сводит звук и готовит версии под разные каналы. На выходе готовый ролик и его варианты по форматам и длительности. Редактор утверждает важные сборки и права на музыку и материалы. Ключевое ограничение: смысл высказывания монтажом менять нельзя, для чувствительных тем сохраняется след от исходника до сборки."},{"ru":"Автопостинг","text":"Автопостинг — это руки, которые нажимают кнопку. Она принимает одобренные материалы, расписание, сегмент получателей и доступы к площадкам, проверяет форматы, ставит выпуск в очередь, публикует и сверяет доставку. Остаются вышедшие записи, отправленные письма и записи о доставке. Человек задает правила подтверждения, а острые и кризисные выпуски согласует явно. Повторный запуск не должен выпускать одно и то же дважды, это самая частая авария."},{"ru":"Управление комментариями","text":"Работа с комментариями идет постоянно, без расписания. Агент читает обсуждения и упоминания, готовит ответы, наводит порядок и вычленяет вопросы, заявки, риски и сигналы о продукте. После него остаются ответы, действия модерации и переданные дальше обращения. Конфликтные, правовые и кризисные ветки человек забирает себе вместе с уже собранным разговором. Спорить от имени бренда вне принятых правил нельзя, и каждое действие модерации оставляет след."},{"ru":"Инсайты от аудитории","text":"Портрет аудитории замыкает круг. Он сводит показатели записей, данные о подписчиках и комментарии, ищет закономерности, сравнивает форматы и формулирует, какие темы и зацепки действительно работают. Выводы уходят обратно в план публикаций и в разбор каналов. Человек толкует малые выборки и решает, менять ли содержание по стратегическим причинам. И здесь важное ограничение: строить чувствительные портреты по личным признакам без законного основания недопустимо."}]},{"title":"Продажи","lead":"Продажи превращают интерес рынка в сделку. Здесь все идет от предложения и карточки продукта к поиску потенциальных клиентов, первому контакту, повторным касаниям, квалификации, переговорам, ведению сделки, допродажам и аналитике. ИИ отлично готовит контекст, сообщения, сценарии и следующий шаг. Но там, где появляются доверие, сложные переговоры, цена и обязательства перед клиентом, человек остается владельцем решения.","items":[{"ru":"Подготовка оффера","text":"Подготовка предложений берет портрет клиента, позиционирование, цены и список типичных возражений, а отдает готовую коммерческую конструкцию: состав пакетов, доводы ценности, варианты цены, обещания и их границы. Продавец получает блоки, из которых собирается документ, и не выдумывает условия на ходу, стоя перед покупателем. Человек здесь обязателен: владелец продаж утверждает цену, скидки, гарантии и любые нестандартные обязательства. Придумывать юридические или продуктовые обещания агент права не имеет."},{"ru":"Карточки товаров","text":"Карточки товаров превращают утвержденное предложение в единое продающее описание для сайта, каталогов, торговых площадок и системы учета клиентов. Агент сверяет характеристики, пишет описание и выгоды, подбирает изображения, собирает варианты и ответы на частые вопросы. Оператор подтверждает цену и заявления, которые нужно проверить на соответствие. Ловушка здесь ровно одна: расхождение цены между сайтом и каталогом. Источник данных о продукте обязан оставаться единственным для всех каналов."},{"ru":"Лидогенерация","text":"Привлечение заявок ищет тех, кому вы действительно нужны. По портрету клиента, географии и признакам интереса агент находит организации и контактных лиц, проверяет источник, дополняет сведения и ставит первичную оценку. Остается очередь заявок, где у каждой строки видно, откуда она взялась и чем подтверждена. Оператор утверждает источники, целевые списки и правила обращения с личными данными. Собирается только необходимый минимум сведений, и ни строкой больше."},{"ru":"Аутрич","text":"Холодные касания делают первый шаг навстречу. Агент берет профиль заявки, находит повод, выбирает разрешенный канал и пишет сообщение под конкретную организацию, а не общую рассылку на всех сразу. Ответы тут же ложатся в общую историю коммуникации. Оператор утверждает кампанию, отправляющие адреса и особенно важные письма. Обязательны ограничение частоты, возможность отказаться и честное указание отправителя — иначе это уже не касание, а давление."},{"ru":"Фоллоу-апы","text":"Повторные касания отвечают за то, чтобы разговор не затух. Агент смотрит историю общения, стадию сделки и данные обещания, подбирает следующий шаг, готовит напоминание и заранее подсвечивает сделки, которые слишком долго стоят без движения. Оператор задает допустимую настойчивость и подтверждает касания по крупным клиентам. А если человек отказался, цепочка прекращается сразу, в тот же момент, без последнего вежливого письма вдогонку. Настойчивость и навязчивость разделяет очень тонкая грань."},{"ru":"Квалификация","text":"Квалификация клиента отвечает на неприятный, но честный вопрос: а сделка вообще реальна? Агент сверяет обратившегося с портретом, ищет настоящую задачу, полномочия, сроки и деньги, собирает доказательства и отдельно называет причины отказа и недостающие вопросы. Он же подсказывает, кого вести дальше, а кого честно отложить. Владелец продаж решает спорные случаи и судьбу крупных сделок. Оценка всегда объясняется доказательствами, а не общим впечатлением от разговора."},{"ru":"Переговоры с клиентом","text":"Переговоры с клиентом — это содержательный диалог до решения. На вход идут контекст покупателя, предложение, прошлые разговоры и типичные возражения. Агент готовит вопросы к встрече и план показа продукта, разбирает сомнения и фиксирует согласованный следующий шаг. После встречи остаются записи, снятые возражения и понятная картина дальнейших действий. К сложным переговорам и ключевым клиентам человек подключается лично. Неподтвержденных обещаний агент не дает никогда."},{"ru":"Управление сделками","text":"Ведение сделок держит сделку от появления возможности до закрытия. Стадии, документ предложения, согласования, условия оплаты, проверочный список перед подписанием и прогноз — все это остается после агента, и ни одна договоренность по дороге не теряется. Граница здесь жесткая: подготовить может агент, а подписать и взять обязательство перед клиентом вправе только человек с полномочиями. Цены, скидки и договор утверждает он же, а закрытый клиент уходит дальше — в допродажи и в аналитику."},{"ru":"Допродажи","text":"Допродажи работают там, где клиент уже ваш. Агент смотрит, как продуктом реально пользуются, проверяет здоровье отношений и обращения в поддержку, находит обоснованный повод расширить пользу и подбирает момент: старший пакет, смежный продукт, продление, возвращение. Ответственный за клиента подтверждает предложение, особенно если недавно были жалобы. И правило, которое не обходят ни при каких планах: не предлагать расширение тому, кто еще не получил базовую пользу."},{"ru":"Аналитика клиентов","text":"Аналитика клиентов замыкает круг. Она берет данные учета клиентов, итоги сделок, выручку и записи разговоров и объясняет, кто покупает, почему сделки выигрываются или теряются и где спрятан рост. Выводы возвращаются тем, кто готовит предложения, оценивает заявки и планирует расширение. Оператор проверяет определения показателей. Наблюдаемую связь агент за причину не выдает, а по слишком малым сегментам выводов вообще не публикует. Отсюда обратная связь возвращается в самое начало цепочки."}]},{"title":"Поддержка","lead":"Поддержка начинается после того, как клиент уже пришел с вопросом или проблемой. Каналы могут быть разными — почта, сайт, мессенджеры, база частых вопросов, — но внутри это один процесс. Обращение нужно понять, зарегистрировать, классифицировать, решить или передать дальше. Если проблема повторяется, она должна стать задачей для продукта или разработки. Поэтому поддержка — не тупик в конце цепочки, а один из главных источников обратной связи для всей компании.","items":[{"ru":"Ответы на частые вопросы","text":"Ответы на частые вопросы берут вопрос клиента и все, что считается проверенным источником: документацию, правила, список известных проблем. Агент понимает суть, ищет по базе знаний, собирает ответ и всегда указывает, откуда он взят. Остается ответ со ссылкой и честная оценка собственной уверенности. Если уверенности мало или толкование правил спорное, обращение уходит человеку. Заодно агент замечает, чего в базе знаний не хватает, и заводит заявку на новую тему."},{"ru":"Поддержка по почте","text":"Поддержка по почте начинается с входящего письма и всей истории прошлых обращений этого клиента. Агент разбирает письмо, уточняет, что человеку на самом деле нужно, готовит ответ и обновляет карточку обращения. После него остается отправленный ответ, обновленное обращение и короткая сводка для коллег. Границу проводим жестко: возвраты, начисления и все, что трогает доступ и личные данные, подтверждает человек. Личность проверяется до любого изменения в учетной записи."},{"ru":"Поддержка на сайте","text":"Поддержка на сайте работает там, где клиент находится прямо сейчас, в живом разговоре внутри продукта. Она видит страницу, на которой человек застрял, и состояние его учетной записи, поэтому подсказывает не общий совет, а точный следующий шаг. Остается ответ, проведенный по шагам маршрут и, если нужно, заведенное обращение с описанной проблемой. Сложные разговоры и действия с заметными последствиями подхватывает человек. Ничего разрушительного агент без входа клиента не делает."},{"ru":"Поддержка в мессенджерах","text":"Поддержка в мессенджерах решает старую боль. Клиент пишет в один канал, потом в другой, и вот уже три параллельные ветки про одно и то же. Агент опознает собеседника, связывает разговор с существующим обращением, отвечает прямо в канале и при необходимости передает дальше по маршруту. История остается единой. Чувствительные обращения ведет человек. И главное ограничение: без достаточной проверки личности собеседник с учетной записью не связывается."},{"ru":"Управление обращениями","text":"Ведение обращений — это сердце направления. Сюда стекаются запросы из всех каналов, и агент ведет их одной очередью: заводит карточку, ставит срочность, назначает владельца, следит за сроками ответа. Он склеивает повторы и не дает обращению потеряться между каналами, сменами и людьми. Работает постоянно, а не по расписанию. Повторное обновление не меняет состояние дважды, история изменений сохраняется целиком. Споры о срочности и спорные закрытия решает человек."},{"ru":"Классификация","text":"Классификация обращений работает в паре с предыдущим агентом и подает ему готовую разметку. Берет текст обращения, справочник категорий и историю похожих случаев. Определяет тип и зону продукта, оценивает тяжесть и срочность, находит повторы, предлагает маршрут и честно сообщает свою уверенность. Разметку тяжелых обращений и всего, что касается доступа и личных данных, проверяет человек. Настроение клиента здесь вспомогательный признак, а не повод отказать в помощи."},{"ru":"Баг репортинг","text":"Заявки об ошибках — это переводчик с языка жалобы на язык разработки. На входе обращение, версия приложения, устройство, журналы и снимки экрана. Агент уточняет шаги, пробует повторить сценарий, вычищает личные данные и секреты, оформляет заявку. Остаются шаги повторения, ожидаемое и фактическое поведение, окружение и приложенные доказательства. Типичная ошибка здесь — принять фразу «ничего не работает» за описание. Тяжесть ошибки и безопасность передачи журналов подтверждает человек, а дальше заявка уходит разработке."},{"ru":"Заявки на фичи","text":"Пожелания к продукту превращают просьбы клиентов в доказательства спроса. Агент читает обращения, звонки и комментарии, выделяет саму проблему, объединяет повторяющиеся просьбы, считает частоту и показывает, каких сегментов клиентов это касается. Ключевая тонкость: фиксируется боль клиента, а не готовое решение из его слов. Приоритет назначает человек со стороны продукта, и это его зона ответственности. Сроков клиенту агент не обещает никогда, даже если очень хочется порадовать."},{"ru":"Эскалация на вторую линию","text":"Вторая линия нужна тогда, когда первая уже сделала все, что могла. Агент проверяет основание для передачи, собирает контекст: карточку обращения, историю попыток, данные из системы. Находит нужного владельца и следит, чтобы обращение приняли в работу. Клиент не пересказывает свою историю заново. Специалист принимает решения вне правил первой линии. Ограничение простое: наверх уходит не все подряд, основание и будущий владелец называются явно."},{"ru":"Аналитика поддержки","text":"Аналитика поддержки замыкает круг. Раз за разом она считает объем и сроки решений, читает оценки клиентов, ищет повторяющиеся темы и добирается до корневых причин. На выходе сводка показателей, список повторов и конкретные предложения по продукту, процессам и базе знаний. Руководитель поддержки подтверждает причины и изменения в правилах работы. И запрет, который стоит запомнить: нельзя оптимизировать только на снижение числа обращений, верное решение важнее."}]},{"title":"Аналитика","lead":"Аналитика — это контур, который превращает неопределенность в доказательства и решения. Сначала мы исследуем вопрос и понимаем бизнес-проблему. Потом формализуем требования, разбираем очередь работ и риски, работаем с данными и таблицами, собираем отчет и только после этого принимаем решение. Здесь важно не путать красивое объяснение с доказательством: любой вывод должен быть связан с источником, расчетом или явно обозначенным предположением.","items":[{"ru":"Deep Research","text":"Глубокое исследование берет на вход сложный вопрос, границы поиска и список разрешенных источников. Дальше оно дробит вопрос на части, собирает внутренние и внешние материалы, сверяет между собой противоречия и сводит выводы. После него остается карта доказательств, оценка надежности источников и честный перечень открытых вопросов. Человек задает рамки поиска и подтверждает выводы там, где цена ошибки высока. При этом отделяется факт из источника, собственный вывод и рекомендация — смешивать их запрещено."},{"ru":"Бизнес-анализ","text":"Бизнес-анализ включается раньше, чем кто-то произнес слово решение. Он получает цели компании, беседы с участниками, данные о процессах и описание текущих систем. Уточняет, в чем именно проблема, строит карту заинтересованных сторон, разбирает процесс так, как он идет сегодня, и собирает варианты движения. Остается формулировка проблемы, ограничения и темы будущих требований. Владелец направления подтверждает эту формулировку и ее приоритет. Типичная ошибка здесь — прийти с готовым ответом и подогнать под него потребность."},{"ru":"Требования к продукту","text":"Требования к продукту переводят продуктовую задачу в документ, по которому уже можно проектировать и разрабатывать. На входе цель продукта, данные о пользователях, итоги бизнес-анализа и ограничения. Агент описывает проблему, очерчивает границы работ, пишет сами требования и критерии приемки. На выходе документ, сценарии использования и перечень нерешенных вопросов. Владелец продукта утверждает границы и критерии. Технику реализации сюда не пускают: как именно строить, решает соседний документ."},{"ru":"Требования к бизнесу","text":"Требования бизнеса собирают в один согласованный документ цели компании, обязательные правила и ожидаемый результат. Опираются на итоги бизнес-анализа, карту процессов, действующие политики и цели участников. Фиксируют деловые правила, определяют границы работ, отмечают зависимости и условия приемки. Остается текст, на который можно сослаться в споре. Владелец направления утверждает обязательные правила. Граница ответственности простая: что нужно бизнесу — сюда, каким способом это сделать — в соседние документы."},{"ru":"Технические требования","text":"Технические требования отвечают на вопрос, что нужно системе, чтобы утвержденные границы работ вообще стали возможны. На вход идут продуктовые требования, текущая архитектура, условия по нагрузке, обмену и защите данных. Агент сверяется с устройством системы, описывает взаимодействия, задает условия качества и готовит проверки приемки. Остаются описание данных, зависимости и порядок перехода. Технический руководитель утверждает решения по устройству. Непроверенное предположение записывать как факт нельзя, спорное оформляется отдельно."},{"ru":"Разбор бэклога","text":"Разбор очереди задач превращает требования в работу, которую команда может взять завтра утром. Он читает документы, ошибки, пожелания, план развития и возможности команды. Дробит крупное на выполнимые задачи, пишет к каждой критерии приемки, находит зависимости и предлагает очередность. Остается очередь, где видно, что готово к работе, а что нет. Владелец продукта или технический ведущий утверждает порядок. Дробить механически нельзя: у каждой задачи должен быть проверяемый результат."},{"ru":"Анализ рисков","text":"Анализ рисков работает постоянно, а не от случая к случаю. Он смотрит на план, предположения, зависимости и прошлые сбои и ищет угрозы: деловые, продуктовые, рабочие и технические. Оценивает вероятность и тяжесть последствий, предлагает ранние признаки и меры с ответственными. Остается перечень рисков с оценкой и остаточным уровнем. Владелец риска решает, принять его, снизить или передать. Тяжелые случаи всегда за человеком, а субъективную оценку нельзя выдавать за точную."},{"ru":"Анализ данных","text":"Анализ данных отвечает на конкретный бизнес-вопрос числами и является основной ролью для работы с таблицами. Он получает CSV, Excel, выгрузки из систем и определения показателей, очищает данные, связывает источники, пишет формулы, делает сводные таблицы, графики, сценарные расчеты и прогнозы. На выходе остается воспроизводимая таблица или модель: видно, откуда взялась каждая цифра и какие допущения использованы. Аналитик проверяет смысл показателей, формулы и критичные расчеты, а выводы затем уходят в аналитический отчет."},{"ru":"Аналитический отчет","text":"Аналитический отчет собирает исследования, расчеты и оценки рисков в один документ для тех, кто принимает решение. Он отбирает главное, честно описывает метод, строит наглядность и формулирует выводы вместе с их последствиями. Остается краткая выжимка, находки, графики и оговорки. Оператор утверждает итоговые выводы перед внешним или особо важным использованием. Прятать отрицательный или пустой результат нельзя, а картинка обязана точно соответствовать данным, а не украшать их."},{"ru":"Decision Intelligence","text":"Поддержка решений — последняя плитка направления и весь его смысл. Она берет вопрос выбора, цели и все, что накопили соседи: доказательства, расчеты, риски. Раскладывает варианты по критериям, считает сценарии, показывает взаимные уступки, ожидаемые последствия и обратимость каждого шага. Остается записка о решении со следом обоснования. Само решение принимает человек, особенно тяжелое и необратимое. Рекомендация — это еще не полномочие, и агент эту границу не переходит."}]},{"title":"Дизайн","lead":"Дизайн превращает идею в форму, с которой уже может взаимодействовать человек. Сначала появляются Creative Generation и Design System, потом Presentation Creation и Landing Page, дальше User Flow, User Experience, User Interface и Application Prototype. После этого User Simulation и Usability Analysis помогают заранее увидеть слабые места. ИИ здесь быстро создает варианты и прогоняет сценарии, а человек отвечает за вкус, смысл, доступность и финальный выбор.","items":[{"ru":"Генерация креативов","text":"Тут берется задание на креатив, брендбук, примеры и ограничения канала. На выходе вы получаете не одну случайную идею, а несколько разных направлений: доски настроения, ключевые образы и запросы для генерации. Дальше человек выбирает направление и подтверждает права на образы, бренд и внешность людей."},{"ru":"Дизайн-система","text":"Дизайн-система смотрит на книгу бренда, текущий интерфейс, целевые платформы и требования доступности. Она задает переменные, описывает элементы и правила применения, ведет версии. После нее остается набор, на котором держится весь вид продукта и его сборка. Человек подтверждает состав основных элементов и любые изменения, ломающие совместимость. Без этой роли каждый экран рисуется заново, и продукт распадается на куски, разные по духу."},{"ru":"Создание презентаций","text":"Создание презентаций начинается с цели выступления, слушателя, исходных данных и стиля бренда. Сотрудник строит линию рассказа, раскладывает слайды, добавляет графику и пишет заметки докладчику. Остается готовая презентация, которую слушателю легко пройти от начала до вывода. Автор подтверждает линию рассказа, каждое утверждение и итоговую версию перед показом. И правило, которое не нарушается: данные не искажаются ради красоты слайда, источник каждой цифры остается виден."},{"ru":"Landing Page","text":"Сайт получает позиционирование, предложение, портрет клиента и целевое действие. Сотрудник строит структуру, пишет разделы, собирает макет под разные устройства и размечает события. Остается понятный путь от первого экрана до заявки и описание для сборки. Человек подтверждает обещания на странице и само целевое действие. Приемы обмана и скрытые ловушки под запретом, а доступность и согласие на слежение учитываются сразу, а не потом."},{"ru":"User Flow","text":"User Flow опирается на требования к продукту, задачи человека, ограничения системы и текущий продукт. Агент собирает шаги, ветвления, ошибки, точки входа и выхода. Остаются схемы, список состояний и честная карта того, что происходит не только в идеальном сценарии. Человек утверждает основной путь и правила для редких состояний. Типичная ошибка — описать только happy path и забыть про пустые состояния, ожидание, ошибки и запреты."},{"ru":"User Experience","text":"Пользовательский опыт берет User Flow, исследования пользователей, требования и данные о поведении. Агент продумывает структуру взаимодействия, порядок информации, обратную связь системы и путь человека к результату, стараясь убрать лишние действия и когнитивную нагрузку. Человек решает компромиссы между удобством, целями бизнеса и техническими ограничениями. Важная граница: нельзя улучшать вовлечение за счет манипуляций и интересов самого пользователя."},{"ru":"User Interface","text":"Пользовательский интерфейс — это точка, где пользовательский опыт и дизайн-система превращаются в конкретные экраны. На вход идут User Flow, UX-решения, компоненты и правила платформы. Агент собирает экраны, состояния и адаптивные варианты, использует готовые компоненты и готовит спецификацию для разработки. Человек утверждает ключевые экраны и любые осознанные отступления от дизайн-системы. Нельзя проектировать интерфейс, который потом невозможно нормально реализовать или поддерживать."},{"ru":"Прототип приложения","text":"Application Prototype показывает продукт в движении: кликаемая или работающая версия, переходы, состояния и ключевые сценарии. На вход идут User Flow, пользовательский интерфейс, требования и примеры данных. На таком прототипе уже можно проверить идею с людьми до дорогой разработки. Человек определяет, что именно прототип способен доказать, а что на нем проверить нельзя. Упрощенные данные и неполное поведение всегда помечаются явно: прототип нельзя выдавать за готовую систему."},{"ru":"Симуляция пользователей","text":"Симуляция пользователей запускает виртуальных пользователей по заданным профилям и задачам. Агент прогоняет сценарии, ищет места затруднений и собирает записи прохождений, отказы и проблемные состояния. Так можно дешево получить ранние гипотезы и проверить редкие случаи. Но это именно гипотезы: исследователь задает сценарии и не принимает симуляцию за замену реальным пользователям. Дальше результаты передаются в анализ удобства использования."},{"ru":"Анализ удобства использования","text":"Анализ удобства использования закрывает цикл. На вход идут результаты симуляция пользователей, реальные пользовательские тесты, продуктовые данные и интерфейсы. Агент считает успешность выполнения задач, находит трения, ошибки и проблемы доступности, а затем предлагает изменения. Результаты возвращаются в User Flow, пользовательский опыт, пользовательский интерфейс и управление продуктом. Человек определяет приоритет находок и подтверждает критичные выводы на реальных пользователях."}]},{"title":"Разработка","lead":"Разработка — это место, где требования и макеты становятся работающим продуктом. Сначала агент разбирает кодовую базу, затем создаются клиентская и серверная части, база данных, ИИ-функции и интеграции. После этого идут тесты, поиск ошибок, рефакторинг и проверка кода. Чем ближе действие к рабочей среде и данным пользователей, тем строже права и тем чаще нужен человек. Главный принцип простой: код можно генерировать быстро, но выпускать его без проверки нельзя.","items":[{"ru":"Анализ кодовой базы","text":"Анализ кодовой базы берет на вход хранилище кода, документацию, сборку с тестами и задуманное изменение. Дальше он читает, ищет и строит карту связей: кто от кого зависит, где спрятаны неочевидные нити. После него остается список файлов, которых коснется правка, план изменений и честный перечень открытых вопросов. Человек подтверждает выводы о зонах сильного влияния. Важное ограничение: на этом этапе агент работает только на чтение и ничего не правит."},{"ru":"Разработка фронтенда","text":"Разработка фронтенда (клиентской части) получает макеты, дизайн-систему, требования и описание обмена данными. Она превращает все это в живые экраны: состояния загрузки, поведение при ошибках, пустые списки, то есть все, что обычно забывают нарисовать в макете. На выходе код видимой части, готовые блоки экранов, логика состояний и тесты. Человек утверждает значимые изменения устройства кода и слияние в защищенные ветки. Работает в паре с серверной частью: без согласованного обмена данными красивый экран останется пустым."},{"ru":"Разработка бэкенда","text":"Разработка бэкенда (серверной части) строит то, чего пользователь не видит: деловую логику, точки обмена данными, вход и права, фоновые задачи. Отдельная забота здесь наблюдаемость, чтобы сбой был виден раньше, чем о нем напишут пользователи. Остаются службы, фоновые задачи, тесты и метки для наблюдения. Человек утверждает несовместимые изменения обмена, логику прав и выкладку в рабочую среду. Права и безопасность вообще не выпускают без разбора человеком, а обмен данными ведут по версиям."},{"ru":"Разработка базы данных","text":"Разработка базы данных получает требования к данным, текущую схему, способы обращения и ожидаемый объем. Агент уточняет модель, меняет схему, пишет запросы и указатели, готовит перенос вместе с путем отката. После него остаются изменения схемы, сами переносы и план возврата назад. Человек утверждает разрушающие переносы и любые правки данных в рабочей среде. Типичная ошибка здесь дорогая: перенос запустили без копии, а откатывать оказалось нечем и неоткуда."},{"ru":"Разработка ИИ","text":"Тут создаем ИИ-фичи внутри самого продукта. На вход идут сценарий использования, признаки успеха, данные и знания, ограничения модели. Агент собирает связку шагов, пишет указания, выдает инструменты и гоняет наборы испытаний. Остаются работающая связка, схемы, записи выполнения. Человек утверждает смену модели, пороги испытаний и действия с сильными последствиями. Без пройденных испытаний и защиты от подмены указаний выпускать нельзя, а права инструментов держат самыми узкими."},{"ru":"Интеграции","text":"Интеграции соединяют продукт с чужими системами: обмен данными, обратные вызовы, разъемы, потоки событий. На вход идут требования к связке, описания сторонних систем, правила по ключам и схемы данных. Агент изучает чужой обмен, пишет разъем, настраивает вход и добавляет повторы. Остаются готовый разъем, сопоставление полей, обработчики и тесты. Человек утверждает объем выданных прав и любую запись во внешнюю систему. Ключи хранятся отдельно, а повторный вызов не выполняет действие дважды."},{"ru":"Автоматическое тестирование","text":"Автоматическое тестирование проверяет продукт без человека: отдельные части, их совместную работу, сквозные сценарии и защиту от возврата прежних ошибок. Берут условия приемки, код, прошлые ошибки и данные для проверок. Оставляют план, код проверок, отчеты о прогонах и список непокрытых мест. Человек решает судьбу шатких и важных падений и допускает изменения к выпуску. Гнаться за красивой долей покрытия без осмысленных сверок бессмысленно: такие проверки не ловят ничего."},{"ru":"Дебаггинг","text":"Дебаггинг начинается с заявки, записей, следов и упавших проверок. Задача тут не унять симптом, а доказать настоящую причину: воспроизвести сбой, сузить область, показать доказательства. Остаются способ воспроизведения, доказанная причина, небольшая правка и проверка, которая не даст ошибке вернуться. Человек утверждает срочные правки и все, что затрагивает рабочую среду. Дальше находка уходит автотестам и проверке кода, чтобы починка закрепилась в общем наборе."},{"ru":"Рефакторинг","text":"Рефакторинг улучшает внутреннее устройство, не меняя поведение продукта намеренно. На вход идут разбор кодовой базы, замечания, существующие тесты и больные места, которые всех давно раздражают. Агент отбирает узлы долга, планирует шаги, правит по частям и сверяет поведение прогоном проверок. Остаются план, измененный код, подтверждение сохранения поведения и обновленные тесты. Человек утверждает крупный рефакторинг и компромисс со сроками выпуска. Без надежного набора проверок крупную переработку дробят."},{"ru":"Ревью кода","text":"Код-ревью замыкает направление. Она разбирает предложенные правки до слияния: правильность, читаемость, признаки угроз, скорость и совпадение с требованиями. На выходе замечания по важности, список обязательных исправлений и совет по слиянию со ссылками на находки. Само слияние в защищенные ветки остается за человеком или за правилом с подтверждением. Граница ответственности жесткая: опрятный вид изменения не повод подтвердить его, если есть риск ошибки или угроза безопасности."}]},{"title":"Инфраструктура","lead":"Инженерия отвечает за среду, в которой продукт должен стабильно работать. Здесь уже не создают саму функцию продукта — здесь управляют доступами, инфраструктурой, платформой, безопасностью, сетью, производительностью, выкладкой, резервными копиями, наблюдением и инцидентами. Это слой надежности. Его задача — чтобы продукт выдерживал нагрузку, изменения можно было безопасно выпускать и откатывать, а проблему замечали раньше, чем о ней напишет клиент.","items":[{"ru":"Управление доступами","text":"Управление доступами берет на вход учетную запись, роль, проект и сам запрос. Проверяет основание, подбирает права по минимуму, выдает их на срок, а когда работа закончена, забирает обратно. После него остаются выданные и отозванные права, регулярная сверка доступов и неизменяемый журнал. Человек подтверждает повышенные права и любые исключения из общих правил. Типичная ошибка здесь одна: забытый доступ подрядчика, который живет месяцами после окончания сотрудничества."},{"ru":"Управление инфраструктурой","text":"Управление инфраструктурой получает требования по нагрузке, схему решения, перечень окружений и ограничения по расходам. Считает нужный запас прочности, описывает всю среду кодом, собирает окружения и постоянно сверяет живое состояние с описанием. На выходе остаются описание среды кодом, готовые окружения, образец настройки и план запаса мощности. Инженер подтверждает разрушающие изменения и дорогое расширение мощностей. Ручные правки в обход описания запрещены, иначе среда перестает собираться заново."},{"ru":"Управление платформой","text":"Управление платформой превращает базовую инфраструктуру в короткий и понятный путь для разработчика. Она принимает запросы команд, типовые виды сервисов и правила безопасности, а собирает образцы, заготовки и внутренний портал, где новый сервис поднимается за минуты. Остаются готовые образцы, самообслуживание и общие службы среды. Владелец платформы подтверждает общие договоренности и изменения, ломающие совместимость. Граница простая: платформа прячет сложность, но никогда не прячет опасные отказы."},{"ru":"Управление безопасностью","text":"Безопасность работает постоянно, а не набегами перед проверкой. На вход идут схема и код продукта, список чужих зависимостей, описание угроз, настройки и права. Сотрудник проверяет код и среду, оценивает опасность каждой находки, готовит исправления и закрепляет меры защиты правилами. Остаются находки по рискам, план исправлений и работающие ограничения. Оператор принимает решение по спорным рискам. Останавливать работу бизнеса в одиночку этот сотрудник не вправе, для этого есть правила эскалации."},{"ru":"Управление сетью","text":"Сеть отвечает за то, как части системы находят друг друга и как обращение доходит до пользователя. На вход идут схема сервисов, картина обращений, список площадок и требования к задержке. Дальше строится схема связей, настраиваются маршруты, разделяются среды. Остаются схема сети, правила маршрутов и защиты, отчет о связности. Инженер подтверждает правки в рабочей среде: одно изменение задевает сразу все, поэтому только поэтапно и с заранее готовым возвратом."},{"ru":"Управление производительностью","text":"Управление производительностью начинается с замера, а не с догадки о том, где именно что-то тормозит в продукте. Сотрудник берет замеры, следы вызовов, профили нагрузки и цели по времени ответа, снимает картину, находит настоящее узкое место, проверяет систему под нагрузкой и вносит настройку. Остаются разбор узких мест, отчет о нагрузке и рамки допустимого. Инженер подтверждает все, где скорость меняется на стоимость или надежность. В паре работает с серверной частью и базами данных."},{"ru":"CI/CD","text":"CI/CD ведет изменение от внесенной правки до рабочей среды. Принимает правки, наборы проверок, настройки сборки и правила выпуска. Собирает, прогоняет проверки, держит защитные рубежи, выкладывает выпуск и умеет быстро вернуть прошлую версию. Остаются готовые сборки, отчеты проверок, выложенный выпуск и журнал выкладок. Человек подтверждает выход в рабочую среду и любой срочный обход проверок. Ключи доступа в сборку не попадают никогда, это жесткая граница."},{"ru":"Бэкап и восстановление","text":"Бэкап и восстановление нужен не ради хранения, а ради возврата к прежней версии. Сотрудник получает перечень данных, важность сервисов, сроки хранения и цели восстановления, задает правила, делает копии по плану и регулярно пробует восстановиться по-настоящему. Остаются готовые копии, порядок восстановления, отчет о проверке и доказательства удачного возврата. Оператор подтверждает сроки хранения, разрушающее восстановление и объявление крупного отказа. Копия, которую ни разу не разворачивали, защитой не считается вовсе."},{"ru":"Мониторинг системы","text":"Мониторинг системы работает непрерывно и молча, пока все в порядке. Оно собирает замеры служб, записи о работе и следы вызовов, сравнивает их с ожидаемым и поднимает тревогу раньше, чем сбой заметит пользователь. Остаются сводки здоровья, сигналы тревоги, найденные отклонения и прогноз нехватки ресурсов. Дежурный настраивает правила тревог и подтверждает спорные отклонения. Главная опасность тут своя: поток лишних сигналов, на который очень быстро перестают смотреть."},{"ru":"Разбор инцидентов","text":"Разбор инцидентов включается по сигналу тревоги или сообщению о сбое. Сотрудник объявляет сбой, назначает уровень важности и ответственных, ведет ход событий, держит связь с людьми и доводит дело до восстановления, а после готовит спокойный разбор настоящих причин. Остаются карточка сбоя, лента событий, сообщения и меры. Человек обязателен для крупных сбоев и публичных сообщений. Разбор идет без поиска виноватых, иначе в следующий раз о сбое просто промолчат."}]},{"title":"Создание компании","lead":"Теперь собираем все вместе. Сто ролей — это еще не компания, пока между ними нет общего порядка работы. Поэтому поверх десяти направлений мы собираем шесть крупных операционных блоков: управление и консалтинг, рекрутинг, маркетинг, продажи с поддержкой, дизайн и разработку. Последняя объединяет сразу три направления — аналитику, разработку и инженерию — поэтому там тридцать ролей. Важно: это не шесть независимых фирм и не жесткий конвейер. Это шесть департаментов одной AI-native компании. Войти можно с любого места: у кого-то уже есть продукт, кому-то нужен только маркетинг, а кто-то начинает с идеи. А если смотреть шире, вместе они образуют стартап-студию: та же система может проверять идеи, запускать продукты и потом ими управлять. При этом отдельный управляющий не нужен: тот же управленческий контур может управлять самой студией, ее продуктами, проектами, процессами, задачами и командой — меняется только контекст.","items":[{"ru":"Консалтинговое агентство","text":"Консалтинг — это все десять ролей управления, собранные в один контур. База знаний и документы хранят контекст, цели задают направление, задачи превращают решения в ежедневную работу, процессы описывают повторяемый порядок, проекты ведут изменения, управление продуктом отвечает за дорожную карту, а календарь, коммуникации и команда поддерживают исполнение. Поверх этого работает консультант с конкретной экспертизой. Меняется отрасль или предмет консультации, но сама операционная система управления остается той же."},{"ru":"Кадровое агентство","text":"Кадровое агентство собирает все десять ролей работы с людьми. Оно помогает описать роль, найти и отобрать кандидатов, подготовить и провести собеседование, организовать ввод в должность, а при необходим
