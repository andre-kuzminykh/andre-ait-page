ости продолжить дальше: поддержка, график, развитие, благополучие и оценка результата. ИИ готовит данные и доказательства, а рекрутер и руководитель принимают решения о человеке. Поэтому один и тот же набор подходит и для рекрутинга как услуги, и для полного HR-сопровождения."},{"ru":"Маркетинговое агентство","text":"Маркетинговое агентство объединяет двадцать ролей маркетинга, контента и соцсетей. Сначала оно разбирается с рынком, конкурентами и клиентом, формирует позиционирование, бизнес-модель, бренд и стратегию выхода. Затем выбирает каналы, строит контент-план, создает статьи, тексты, изображения и видео, публикует их и работает с реакцией аудитории. Сюда же входят платное привлечение и рассылки. Человек отвечает за стратегические ставки, бюджеты, публичные обещания и финальный творческий выбор."},{"ru":"Отдел продаж и поддержки","text":"Продажи и поддержку удобно объединить в один клиентский контур из двадцати ролей. До сделки здесь работают предложение, поиск клиентов, касания, квалификация, переговоры и ведение сделки. После сделки — ответы на вопросы, почта, сайт, мессенджеры, обращения, ошибки, пожелания и вторая линия. Звонки — это просто еще один канал поверх тех же процессов. Человек подключается в сложных переговорах, коммерческих решениях, конфликтах и нестандартных случаях."},{"ru":"Дизайн-студия","text":"Дизайн-студия — десять ролей от идеи до проверенного прототипа. Она создает творческое направление, дизайн-систему, презентации и посадочные страницы, затем проектирует пользовательские сценарии, опыт и интерфейс, собирает прототип и проверяет его на моделируемых и реальных пользователях. ИИ быстро создает варианты и находит возможные проблемы, но финальный выбор, вкус и интерпретация исследования остаются за человеком."},{"ru":"Студия разработки","text":"Разработка — это тридцать ролей трех направлений: аналитика, разработка и инженерия. Сначала мы понимаем, что нужно построить: исследование, требования, риски, таблицы и решения. Потом создаем продукт: frontend, backend, базы данных, ИИ, интеграции, тесты и review. После этого обеспечиваем работу в production: доступы, инфраструктура, безопасность, CI/CD, резервные копии, мониторинг и инциденты. Это полный путь от вопроса бизнеса до работающей системы."},{"ru":"Сквозной процесс","text":"Эти шесть блоков работают не как жесткая цепочка, а как сеть. Результат одного становится входом другого: исследование рынка может уйти в продукт, жалоба клиента — в backlog, новый сотрудник — в доступы и базу знаний. Начать можно с любой точки. Главное, чтобы каждый следующий агент получал утвержденную версию результата, а не случайный текст из прошлого чата. Тогда вся компания работает на одном общем состоянии."},{"ru":"Агент-оркестратор","text":"Над этой сетью работает агент-оркестратор. Пользователь не должен выбирать из ста карточек вручную. Он говорит результат: проверить идею, запустить продукт, увеличить продажи, разобрать сбой. Он раскладывает цель на шаги, выбирает нужных сотрудников, дает каждому только нужный контекст, следит за зависимостями и вызывает человека на точках подтверждения. Сам он не заменяет специалистов — его задача правильно собрать их работу в один процесс."},{"ru":"Финансы вне сотни","text":"Финансовую часть важно разделить на две зоны. Экономику продукта — цены, unit economics, сценарии, прогнозы, runway — можно считать внутри бизнес-модели и аналитики, используя таблицы и детерминированные формулы. Но официальный бухгалтерский учет, налоги, платежные обязательства и отчетность я сознательно не включаю в сотню. Здесь языковая модель может помогать готовить данные и объяснять расчет, но считать и подтверждать критичные суммы должны строгая система и ответственный специалист."},{"ru":"Право вне сотни","text":"С правом похожая логика. ИИ может быть очень полезным помощником юриста: найти нужный пункт, сравнить две редакции договора, собрать риски, подготовить список вопросов. Но это не тот контур, где модель сама принимает правовую позицию и берет ответственность. Подпись, юридическое заключение и обязательства остаются за человеком с соответствующими полномочиями. Поэтому право подключается к общей системе как внешний профессиональный сервис, а не как еще один автономный отдел."}]},{"title":"Ваш агент","lead":"Мы прошли всю карту: десять направлений и сто ролей. Теперь задача не запомнить их все, а научиться правильно собирать одну роль в работающего агента. Последний слайд — про ваш проект на курсе. Вы выбираете конкретный участок работы, описываете контракт, задаете вход и выход, инструменты и права, место человека, проверки качества и условия остановки. После этого можно соединять несколько агентов в цепочку. Но начинать нужно с одной роли, работу которой вы сами хорошо понимаете.","items":[{"ru":"Выбрать одного из ста","text":"Первый шаг самый простой и самый важный: выберите одну роль из сотни и объявите ее своим проектом. Не направление целиком, не три роли сразу, а ровно одну. Берите ту, где вы понимаете работу изнутри: сами писали такие тексты, сами разбирали такие обращения, сами вели такие задачи. Это нужно не для удобства, а для проверки: если вы не отличите хороший результат от правдоподобно выглядящего, вы не сможете оценить своего агента."},{"ru":"Если задачи нет один в один","text":"Если вашей задачи нет в сотне один в один, сначала проверьте, не является ли она частным случаем существующей роли, отдельным инструментом или связкой нескольких агентов. Например, работа с таблицами — это Data Analysis, а рассылка — workflow поверх маркетинговых и коммуникационных capabilities. Для курса базовую карту из ста ролей мы не расширяем: новую потребность сначала собираем из существующих capabilities, tools и workflows."},{"ru":"Контракт агента","text":"Контракт превращает идею агента в понятную работу. В нем нужно заранее записать: что приходит на вход, какой контекст нужен, какие инструменты и права доступны, какие шаги выполняются, что должно остаться на выходе, как проверить качество, где нужен человек и что записывается обратно в память. Пока этого нет, у вас просто хороший чат с моделью. Сначала оформляем контракт, потом уже пишем промпт и подключаем инструменты."},{"ru":"Сначала схемы данных","text":"Частая ошибка новичка: сесть и начать писать длинный запрос к модели. Правильный порядок обратный. Сначала опишите, что агент получает и что он обязан вернуть, поле за полем, с типами и обязательностью. Возьмите один сложный настоящий пример и заполните им обе формы руками. Если форма выдерживает сложный пример, к ней уже можно писать запрос. Строгая форма выхода позволит передать результат дальше без ручной разборки текста."},{"ru":"Инструменты и права","text":"Агент опасен не рассуждением, а руками. Пока он читает, худшее, что случится, это неверный вывод. Как только он пишет в чужую систему или отправляет письмо наружу, цена ошибки совсем другая. Поэтому права выдаются не роли целиком, а каждому действию по отдельности: это можно читать, это можно создать черновиком, это только после подтверждения. Выпишите список действий, оцените каждое по опасности и оставьте минимум. И записывайте каждый вызов."},{"ru":"Участие человека","text":"Участие человека — это не лозунг, а конкретное место в порядке шагов. Оно ставится там, где цена ошибки выше цены ожидания: перед письмом клиенту, перед выкладкой, перед тратой денег. Внутренние черновики агент готовит сам. У каждой такой остановки должно быть имя ответственного и срок ответа, иначе очередь на подтверждение встанет и агент окажется бесполезным. Слишком много остановок тоже ошибка: тогда проще делать все руками."},{"ru":"Проверки качества","text":"Модель почти всегда отвечает уверенно, поэтому впечатление ничего не доказывает. Нужен набор примеров, где вы заранее знаете верный ответ, и признак успеха, который можно посчитать. Этот набор прогоняется при каждом изменении запроса, схемы или инструмента. Дальше смотрите не на среднее, а на расхождения: где агент ошибся и почему именно там. Один удачный показ на защите это не проверка, а везение, и повторить его нельзя."},{"ru":"Условие остановки","text":"У любого агента должно быть записано, когда он обязан прекратить. Без этого круг повторов тратит деньги и выдает мусор с уверенным лицом. Задайте четыре вещи: что считается сделанной работой, сколько попыток допустимо, сколько времени и денег можно потратить, при каком сомнении задача уходит человеку. Отказ — это нормальный конец работы, если он честный. Агент, который вовремя говорит, что не знает, полезнее того, который выдумывает."},{"ru":"Связка из нескольких","text":"Один агент — это еще не система. Настоящая польза появляется, когда результат первого становится входом второго: разбор очереди задач передает требования, требования передают работу разработке, разработка передает готовое на проверку. Начните с двух-трех, не больше. Главная сложность не в модели, а на границах: форма выхода одного должна точно совпасть с формой входа другого. Прогоните связку целиком и посмотрите, где теряется смысл. Именно там такие сборки и ломаются."},{"ru":"Проект курса","text":"Что вы сдаете в конце. Первое: работающий агент или связка из нескольких, запущенная на настоящих данных, а не рассказ о замысле. Второе: карточка роли по тому же контракту, что мы разбирали. Третье: показатели, по которым видно, что он работает, и записи прогонов. Четвертое: честный разбор ошибок, что ломалось, почему и как вы это починили. Последний пункт ценится больше всего, потому что именно он показывает понимание."}],"outro":["Мы прошли всю карту. Главное, что я хочу, чтобы вы унесли с собой: сто ИИ-сотрудников — это не витрина из ста ботов. Это язык, на котором можно разложить работу компании на понятные участки. У каждого участка есть вход, действия, результат, ответственность и границы.","Начинать нужно не с попытки автоматизировать всю компанию. Выберите одну роль, работу которой хорошо знаете сами. Опишите контракт, задайте форму входа и выхода, подключите минимально необходимые инструменты, определите место человека, сделайте набор проверок и условие остановки. После этого прогоните агента на настоящих примерах и посмотрите, где он ломается.","Когда одна роль работает стабильно, соединяйте ее со второй. Результат первого агента становится входом второго, потом появляется третий — и постепенно из отдельных ролей складывается процесс. Именно так потом собирается вся компания: не одним огромным промптом, а системой небольших сотрудников, которые понимают свои границы и передают друг другу проверенные результаты.","И еще один принцип. ИИ не обязан делать все. Там, где нужна экспертиза, отношения, юридическая или кадровая ответственность, человек остается частью процесса. Хорошая AI-first система не убирает человека любой ценой. Она оставляет человеку именно те решения, где его участие действительно создает ценность.","Поэтому на курсе начните с одного агента. Доведите его до состояния, когда ему можно доверить реальную работу. А уже потом стройте из него команду."]}]</script>
<script>
(function(){
  var root = document.documentElement, body = document.body;

  // ══ ДВЕ ФОРМЫ (канон лекций) ═══════════════════════════════════════════
  // Размер холста задаёт CSS: 1380x864 от 768px и 376x844 до неё. JS считает
  // ОДИН множитель --view-scale по той же границе, поэтому смена формы
  // происходит в одном кадре и промежуточных раскладок не существует.
  // Внутри формы ничего не пересобирается: меняется только transform.
  var REF = { pc: { w:1380, h:864 }, mob: { w:376, h:844 } };
  var GAP_X = 24, GAP_Y = 16;   // «чуть-чуть по бокам зазоры» — минимум 12px
  function form(){ return window.innerWidth < 768 ? 'mob' : 'pc'; }

  function fit(){
    var g = REF[form()];
    var panel = document.getElementById('notes-panel');
    var dock = (body.classList.contains('notes-open') && form() === 'pc' && panel)
      ? panel.offsetWidth : 0;
    var availW = Math.max(160, window.innerWidth - dock - GAP_X);
    var availH = Math.max(160, window.innerHeight - GAP_Y);
    root.style.setProperty('--view-scale', String(Math.min(availW / g.w, availH / g.h)));
    root.style.setProperty('--deck-shift', (dock / 2) + 'px');
  }
  // ── Общий кегль названий плиток ────────────────────────────────────────
  // Длинное русское слово («Производительность») в колонку плитки не влезает,
  // а рвать его посреди себя нельзя — получается «Производительнос-ть».
  // Перенос тут не спасает: слово одно. Значит уменьшаем кегль, и сразу у ВСЕХ
  // плиток колоды, иначе соседние карточки получают разные размеры и ряд
  // «скачет». Это КОНСТАНТА ФОРМЫ: считается один раз на форму и от размера
  // окна не зависит вовсе.
  var MEASURE = null;
  try { MEASURE = document.createElement('canvas').getContext('2d'); } catch(e){}
  function fitNames(){
    if (!MEASURE) return;
    var all = [].slice.call(document.querySelectorAll('.t-name'));
    if (!all.length) return;
    all.forEach(function(n){ n.style.fontSize = ''; });
    var cs = window.getComputedStyle(all[0]);
    var base = parseFloat(cs.fontSize) || 16;
    var head = cs.fontStyle + ' ' + cs.fontWeight + ' ';
    var tail = 'px ' + cs.fontFamily;
    MEASURE.font = head + base + tail;
    // Группа — РЯД плиток одного слайда: канон требует одного кегля в ряду,
    // но не по всей колоде. Иначе одно длинное слово на десятом слайде
    // ужимало бы подписи на всех остальных.
    var groups = {};
    all.forEach(function(n){
      var tile = n.closest('.tile');
      var slide = n.closest('.slide');
      if (!tile || !slide) return;
      var key = slide.getAttribute('data-i') + ':' + Math.round(tile.offsetTop / 8);
      (groups[key] = groups[key] || []).push(n);
    });
    Object.keys(groups).forEach(function(key){
      var row = groups[key], ratio = 1;
      row.forEach(function(n){
        var w = n.clientWidth;
        if (!w) return;
        // Дефис — законная точка переноса, браузер там рвёт строку сам.
        // Меряем куски МЕЖДУ дефисами, иначе «Агент-распорядитель» ужимал
        // весь ряд как одно неразрывное слово.
        var words = n.textContent.split(/[\s\u2011-]+/), i, ww;
        for (i = 0; i < words.length; i++){
          ww = MEASURE.measureText(words[i]).width;
          if (ww > w && w / ww < ratio) ratio = w / ww;
        }
      });
      // 0.97 — запас на межбуквенный интервал: canvas его не учитывает.
      if (ratio < 1){
        var px = Math.max(9, Math.floor(base * ratio * 0.97 * 100) / 100);
        row.forEach(function(n){ n.style.fontSize = px + 'px'; });
      }
    });
  }
  var lastForm = null;
  function fitAll(){
    fit();
    var f = form();
    if (f !== lastForm){ lastForm = f; fitNames(); }
  }
  // Без дебаунса: при ресайзе меняется одна transform-величина, пересобирать
  // нечего — иначе картинка «дышит» секунду после каждого движения окна.
  window.addEventListener('resize', fitAll, { passive:true });
  window.addEventListener('orientationchange', fitAll, { passive:true });
  fitAll();

  // ══ Колода ═════════════════════════════════════════════════════════════
  var slides = [].slice.call(document.querySelectorAll('.slide'));
  var total = slides.length;
  var cur = 0;
  var bar = document.getElementById('progress-bar');
  var counter = document.getElementById('counter');

  function updateSlides(){
    slides.forEach(function(s, i){ s.classList.toggle('is-on', i === cur); });
    if (bar) bar.style.width = ((cur + 1) / total * 100) + '%';
    if (counter) counter.textContent = (cur + 1) + ' / ' + total;
    try {
      if (('#s' + (cur + 1)) !== location.hash)
        history.replaceState(null, '', '#s' + (cur + 1));
    } catch (e) {}
  }
  function go(i){
    var n = Math.max(0, Math.min(total - 1, i));
    if (n === cur) return;
    cur = n; updateSlides();
    if (window.__notesRender) window.__notesRender(cur);
  }
  window.updateSlides = updateSlides;
  window.nextSlide = function(){ go(cur + 1); };
  window.prevSlide = function(){ go(cur - 1); };
  window.gotoSlide = go;
  window.currentSlide = function(){ return cur; };

  var m = /^#s(\d+)$/.exec(location.hash || '');
  if (m) cur = Math.max(0, Math.min(total - 1, parseInt(m[1], 10) - 1));
  updateSlides();

  document.getElementById('nav-prev').addEventListener('click', window.prevSlide);
  document.getElementById('nav-next').addEventListener('click', window.nextSlide);

  document.addEventListener('keydown', function(e){
    if (window.__popOpen && window.__popOpen()) return;      // карточка сама ловит стрелки
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ')
      { e.preventDefault(); window.nextSlide(); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp')
      { e.preventDefault(); window.prevSlide(); }
    else if (e.key === 'Home'){ e.preventDefault(); go(0); }
    else if (e.key === 'End'){ e.preventDefault(); go(total - 1); }
  });

  // Свайп: длинный жест листает, короткий — это нажатие на плитку.
  (function(){
    var sx = 0, sy = 0, st = 0, tracking = false;
    var THRESH = 45, SLOPE = 1.25;
    function excluded(t){
      if (!t || !t.closest) return false;
      return !!(t.closest('#pop') || t.closest('#notes-panel') || t.closest('.nav-arrow'));
    }
    document.addEventListener('touchstart', function(e){
      if (e.touches.length !== 1 || excluded(e.target)) { tracking = false; return; }
      tracking = true; sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = Date.now();
    }, { passive:true });
    document.addEventListener('touchend', function(e){
      if (!tracking) return; tracking = false;
      var t = e.changedTouches && e.changedTouches[0];
      if (!t || (Date.now() - st) > 800) return;
      var dx = t.clientX - sx, dy = t.clientY - sy;
      var adx = Math.abs(dx), ady = Math.abs(dy);
      if (adx < THRESH && ady < THRESH) return;
      if (adx >= ady * SLOPE) { if (dx < 0) window.nextSlide(); else window.prevSlide(); }
      else if (ady >= adx * SLOPE) { if (dy < 0) window.nextSlide(); else window.prevSlide(); }
    }, { passive:true });
  })();

  // Показываем колоду только когда шрифты доехали и масштаб посчитан:
  // иначе виден кадр с чужой метрикой шрифта и другой раскладкой строк.
  // Шрифт мог доехать после первого замера — считаем кегль заново.
  function reveal(){ lastForm = null; fitAll(); body.classList.add('fit-ready'); }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(reveal).catch(reveal);
  else reveal();
  window.addEventListener('load', reveal);
  setTimeout(reveal, 1200);
})();
</script>
<script>
(function(){
  var dataEl = document.getElementById('seminar-data');
  if(!dataEl) return;
  var DECK = {};
  try { DECK = JSON.parse(dataEl.textContent || '{}'); } catch(e){ return; }

  var pop = document.getElementById('pop');
  var card = document.getElementById('pop-card');
  var opener = null, seq = [], seqIdx = 0;

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
  function ic(name, cls){ return '<svg class="' + (cls || 'ic') + '" aria-hidden="true"><use href="#i-' + esc(name) + '"></use></svg>'; }

  function col(head, items, ordered){
    var tag = ordered ? 'ol' : 'ul';
    return '<div class="flow-col' + (ordered ? ' mid' : '') + '">' +
      '<div class="flow-h">' + esc(head) + '</div><' + tag + '>' +
      (items || []).map(function(v){ return '<li>' + esc(v) + '</li>'; }).join('') +
      '</' + tag + '></div>';
  }
  function flowBlock(t){
    return '<div class="flow">' +
      col('Артефакты на входе', t['in'], false) +
      '<div class="flow-ar">' + ic('caret-right') + '</div>' +
      col('Логика работы', t['do'], true) +
      '<div class="flow-ar">' + ic('caret-right') + '</div>' +
      col('Артефакты на выходе', t.out, false) + '</div>';
  }
  function rolesBlock(list){
    return '<ol class="roles">' + (list || []).map(function(v){
      return '<li>' + esc(v) + '</li>'; }).join('') + '</ol>';
  }
  // Метрики идут хэштегами: короткая строка внизу вместо ещё одного раздела.
  function tags(list){
    if(!(list || []).length) return '';
    return '<div class="tags">' + list.map(function(v){
      var s = String(v).trim();
      return '<span>#' + esc(s.charAt(0).toLowerCase() + s.slice(1)) + '</span>';
    }).join('') + '</div>';
  }

  function render(t){
    var isDom = !!(t.roles && t.roles.length);
    var nav = seq.length > 1
      ? '<div class="pop-nav"><button type="button" id="pop-prev" aria-label="Предыдущая карточка">' + ic('arrow-left') + '</button>' +
        '<span>' + (seqIdx + 1) + ' / ' + seq.length + '</span>' +
        '<button type="button" id="pop-next" aria-label="Следующая карточка">' + ic('arrow-right') + '</button></div>'
      : '';
    card.innerHTML =
      '<button class="pop-x" type="button" data-close aria-label="Закрыть">' + ic('x') + '</button>' +
      '<div class="pop-head"><span class="pop-ic">' + ic(t.icon || 'circle') + '</span>' +
        '<div class="pop-id">' +
        (t.dom ? '<div class="pop-dom">' + esc(t.dom) + '</div>' : '') +
        '<h3 class="pop-name" id="pop-name">' + esc(t.ru) + '</h3></div></div>' +
      (isDom ? rolesBlock(t.roles) : flowBlock(t)) +
      (t.human ? '<div class="row-human">' + ic('user-focus') +
        '<div><div class="row-t">Что делает человек</div><div class="row-v">' + esc(t.human) + '</div></div></div>' : '') +
      tags(t.metrics) + nav;
    card.scrollTop = 0;
    var p = document.getElementById('pop-prev'), n = document.getElementById('pop-next');
    if (p) p.addEventListener('click', function(){ step(-1); });
    if (n) n.addEventListener('click', function(){ step(1); });
  }

  function step(d){
    if (!seq.length) return;
    seqIdx = (seqIdx + d + seq.length) % seq.length;
    render(seq[seqIdx]);
  }

  function open(slideIdx, tileIdx, el){
    var s = (DECK.slides || [])[slideIdx];
    if (!s) return;
    seq = s.tiles || []; seqIdx = tileIdx; opener = el || null;
    pop.classList.toggle('acc-warm', slideIdx % 2 === 1);
    render(seq[seqIdx]);
    pop.hidden = false;
    requestAnimationFrame(function(){ pop.classList.add('on'); });
    card.focus();
  }
  function close(){
    pop.classList.remove('on');
    setTimeout(function(){ pop.hidden = true; card.innerHTML = ''; seq = []; }, 200);
    if (opener && opener.focus) opener.focus();
    opener = null;
  }
  window.__popOpen = function(){ return !pop.hidden; };

  document.addEventListener('click', function(e){
    var t = e.target.closest ? e.target.closest('.tile') : null;
    if (t){ open(+t.getAttribute('data-s'), +t.getAttribute('data-t'), t); return; }
    if (!pop.hidden && e.target.closest && (e.target.closest('[data-close]') || e.target.closest('.pop-scrim'))) close();
  });
  document.addEventListener('keydown', function(e){
    if (pop.hidden) return;
    if (e.key === 'Escape'){ e.preventDefault(); close(); }
    else if (e.key === 'ArrowRight'){ e.preventDefault(); step(1); }
    else if (e.key === 'ArrowLeft'){ e.preventDefault(); step(-1); }
  });
})();
</script>
<script>
(function(){
  var panel = document.getElementById('notes-panel');
  var toggle = document.getElementById('notes-toggle');
  var closeB = document.getElementById('notes-close');
  var bodyEl = document.getElementById('notes-body');
  var titleEl = document.getElementById('notes-title');
  var cntEl = document.getElementById('notes-counter');
  var dataEl = document.getElementById('slide-notes');
  if (!panel || !toggle || !dataEl) return;

  var NOTES = [];
  try { NOTES = JSON.parse(dataEl.textContent || '[]'); } catch(e){ NOTES = []; }
  if (!NOTES.length){ toggle.style.display = 'none'; return; }

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }

  function render(i){
    var n = NOTES[i] || {};
    cntEl.textContent = 'Слайд ' + (i + 1) + ' / ' + NOTES.length;
    titleEl.textContent = n.title || '';
    var html = '';
    if (n.lead) html += '<div class="n-lead"><p>' + esc(n.lead) + '</p></div>';
    (n.paras || []).forEach(function(t){ html += '<p>' + esc(t) + '</p>'; });
    if ((n.items || []).length){
      html += '<div class="n-h">Текст по плиткам</div>';
      html += (n.items || []).map(function(it, k){
        return '<div class="n-item' + (k % 2 ? ' alt' : '') + '">' +
          '<span class="n-name">' + esc(it.ru) + '</span><p>' + esc(it.text) + '</p></div>';
      }).join('');
    }
    if ((n.outro || []).length){
      html += '<div class="n-h">В заключение</div>';
      (n.outro || []).forEach(function(t){ html += '<p>' + esc(t) + '</p>'; });
    }
    bodyEl.innerHTML = html || '<p style="opacity:.55">К этому слайду текста нет.</p>';
    bodyEl.scrollTop = 0;
  }
  window.__notesRender = function(i){
    if (document.body.classList.contains('notes-open')) render(i);
  };

  function setOpen(open){
    document.body.classList.toggle('notes-open', open);
    panel.setAttribute('aria-hidden', open ? 'false' : 'true');
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) render(window.currentSlide ? window.currentSlide() : 0);
    // Ширина сцены изменилась — пересчитать масштаб холста в том же кадре
    // и ещё раз после анимации панели.
    window.dispatchEvent(new Event('resize'));
    setTimeout(function(){ window.dispatchEvent(new Event('resize')); }, 400);
  }
  toggle.addEventListener('click', function(){ setOpen(!document.body.classList.contains('notes-open')); });
  closeB.addEventListener('click', function(){ setOpen(false); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && document.body.classList.contains('notes-open') && window.__popOpen && !window.__popOpen())
      setOpen(false);
  });
  ['touchstart','touchmove','touchend'].forEach(function(ev){
    panel.addEventListener(ev, function(e){ e.stopPropagation(); }, { passive:true });
  });
})();
</script>
<script>
(function(){
  // Тумблер темы: тот же ключ, что у лекции и дорожной карты — путь курса
  // не должен «перекрашиваться» при переходе между страницами.
  var btn = document.getElementById('lec-theme');
  if (!btn) return;
  function sync(){
    var dark = document.documentElement.classList.contains('dark');
    btn.innerHTML = '<svg class="ic" aria-hidden="true"><use href="#i-' + (dark ? 'sun' : 'moon') + '"></use></svg>';
  }
  btn.addEventListener('click', function(){
    var dark = document.documentElement.classList.toggle('dark');
    try { localStorage.setItem('welcome-theme', dark ? 'dark' : 'light'); } catch (e) {}
    sync();
  });
  sync();
})();
</script>
</body>
