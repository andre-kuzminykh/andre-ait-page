<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="color-scheme" content="dark light">
<script>(function(){try{if(localStorage.getItem('welcome-theme')==='light')document.documentElement.classList.add('light');}catch(e){}})();</script>
<title>Страница не найдена — Andre AIT</title>
<meta name="robots" content="noindex">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  /* ============================================================
     Andre AIT — страница «не найдено» (GitHub Pages отдаёт её на
     любой несуществующий адрес). Тот же язык, что у дорожной карты
     курса: JetBrains Mono, тёмная #050505, #8854F3 + #F97316.
     Отдельный случай — закрытый модуль курса: адрес вида
     /automation/N/ существует в планах, но лекция ещё не открыта,
     и человеку надо сказать это словами, а не голым «404».
     ============================================================ */
  :root{
    --bg:#050505; --fg:#E5E7EB; --muted:rgba(255,255,255,.55);
    --card-bg:rgba(255,255,255,.04); --card-border:rgba(255,255,255,.10);
    --btn-bg:#FAFAFA; --btn-fg:#050505;
  }
  html.light{
    --bg:#FAFAFA; --fg:#0A0A0A; --muted:rgba(10,10,10,.55);
    --card-bg:#fff; --card-border:rgba(0,0,0,.07);
    --btn-bg:#0A0A0A; --btn-fg:#FAFAFA;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--fg);
    font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,monospace;
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    display:flex; align-items:center; justify-content:center;
    padding:clamp(1.25rem,5vw,3rem); text-align:center;
  }
  ::selection{background:#8854F3;color:#fff}
  .wrap{max-width:34rem;width:100%}
  .ico{
    width:clamp(4.5rem,16vw,6rem); height:clamp(4.5rem,16vw,6rem);
    margin:0 auto clamp(1.25rem,4vw,2rem); border-radius:999px;
    display:flex; align-items:center; justify-content:center;
    background:var(--card-bg); border:1px solid var(--card-border);
    font-size:clamp(1.6rem,6vw,2.2rem); color:#8854F3;
  }
  h1{
    margin:0 0 .75rem; letter-spacing:-.02em; line-height:1.15;
    font-size:clamp(1.35rem,5.5vw,2.1rem); font-weight:800; text-transform:uppercase;
  }
  h1 em{font-style:normal;color:#8854F3}
  p{margin:0 auto clamp(1.5rem,5vw,2.25rem); max-width:26rem; color:var(--muted);
    font-size:clamp(.8rem,3.2vw,.95rem); line-height:1.6}
  .btn-white{
    display:inline-flex; align-items:center; justify-content:center; gap:.5rem; border:0;
    border-radius:999px; font-weight:700; text-transform:uppercase; letter-spacing:.1em;
    background:var(--btn-bg); color:var(--btn-fg); text-decoration:none;
    font-family:inherit; font-size:clamp(.7rem,2.8vw,.8rem);
    height:3.1rem; padding:0 1.8rem; transition:all .3s ease; white-space:nowrap;
  }
  .btn-white:hover{
    background:linear-gradient(100deg,#8854F3 0%,#F97316 50%,#8854F3 100%);
    background-size:250% 250%; color:#fff; transform:translateY(-2px);
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="ico"><i class="fa-solid fa-compass" id="glyph"></i></div>
    <h1 id="ttl">Страница <em>не найдена</em></h1>
    <p id="sub">Проверьте адрес — возможно, страница переехала или ещё не опубликована.</p>
    <a class="btn-white" id="cta" href="/automation/main/">К списку модулей <i class="fa-solid fa-arrow-right"></i></a>
  </div>

<script>
/* Закрытый модуль курса — говорим прямо, что он откроется позже.
   Номер берём из сегментов пути, а не из строки-шаблона: закрытые
   адреса не должны встречаться в исходниках сайта ссылкой. */
(function(){
  var seg = location.pathname.split('/').filter(Boolean);
  if (seg[0] !== 'automation' || !/^[2-8]$/.test(seg[1] || '')) return;
  document.getElementById('glyph').className = 'fa-solid fa-lock';
  document.getElementById('ttl').innerHTML = 'Модуль ' + seg[1] + ' <em>ещё закрыт</em>';
  document.getElementById('sub').textContent =
    'Лекция откроется позже. Пока доступен первый модуль — начните с него, ' +
    'следующие открываются по мере выхода.';
})();
</script>
</body>
</html>
