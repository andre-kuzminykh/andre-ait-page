    <div class="slide-container px-3 sm:px-6 md:px-12 opacity-100 translate-y-0" id="slide-0">
        <div class="content-z text-center max-w-6xl w-full">
            <div class="bg-grayBase/30 border border-grayBase rounded-full px-4 py-1.5 md:py-2 mx-auto mb-2 md:mb-10 inline-block">
                <p class="text-black font-bold uppercase tracking-widest text-[9px] md:text-sm m-0">Лекция 3: Разработка агента</p>
            </div>
            <h1 class="text-2xl sm:text-4xl md:text-5xl lg:text-[60px] font-black mb-2 md:mb-6 leading-tight tracking-tight text-black">
                От бизнес-процесса <span class="text-solar">к автоматизации</span>
            </h1>
            <p class="text-black/60 font-medium text-[11px] md:text-xl mb-4 md:mb-10 max-w-3xl mx-auto">Не просто собрать агента, <span class="whitespace-nowrap">а превратить его в систему</span></p>

            <!-- Три уровня лекции идут потоком слева направо, а петля под ними
                 возвращает эксплуатацию к процессу: агент становится системой,
                 которая работает каждый день. На телефоне уровни — стопкой,
                 петля — скобой справа (js-keep: колонки не складываются) -->
            <div class="js-keep flex flex-row md:flex-col items-stretch w-full max-w-5xl mx-auto">

                <!-- Уровни: на телефоне строки равной высоты (1fr), на ПК колонки
                     равной ширины; между ними бегущий пунктир -->
                <div class="flex-1 md:flex-none min-w-0 grid grid-rows-[1fr_16px_1fr_16px_1fr] md:grid-rows-none md:grid-cols-[1fr_56px_1fr_56px_1fr] items-stretch">
                    <div class="a-in bg-white border border-grayBase rounded-[18px] md:rounded-3xl px-2.5 py-3 md:px-5 md:py-7 flex flex-row md:flex-col items-center justify-start md:justify-center gap-2.5 md:gap-0 h-full">
                        <div class="relative w-12 h-12 md:w-24 md:h-24 shrink-0 md:mb-4 a-step">
                            <div class="absolute inset-0 rounded-full border-2 border-dashed border-solar/40 a-orbit"></div>
                            <div class="absolute inset-[13%] rounded-full bg-grayBase flex items-center justify-center text-black"><i class="ph-fill ph-flow-arrow text-2xl md:text-4xl"></i></div>
                        </div>
                        <div class="min-w-0 text-left md:text-center">
                            <h3 class="font-black text-lg md:text-2xl text-black leading-tight m-0 mb-0.5 md:mb-2">Процесс</h3>
                            <p class="text-[11px] md:text-base text-black/55 leading-snug m-0">что автоматизируем <br>и где нужен ИИ</p>
                        </div>
                    </div>

                    <div class="flex items-center justify-start md:justify-center pl-[27px] md:pl-0">
                        <div class="w-4 h-[2px] md:w-full rotate-90 md:rotate-0 text-solar/60 a-flow"></div>
                    </div>

                    <div class="a-in a-in-2 bg-black border-2 border-solar rounded-[18px] md:rounded-3xl px-2.5 py-3 md:px-5 md:py-7 flex flex-row md:flex-col items-center justify-start md:justify-center gap-2.5 md:gap-0 h-full">
                        <div class="relative w-12 h-12 md:w-24 md:h-24 shrink-0 md:mb-4 a-step">
                            <div class="absolute inset-0 rounded-full border-2 border-dashed border-solar/60 a-orbit"></div>
                            <div class="absolute inset-[13%] rounded-full bg-white/10 flex items-center justify-center text-solar"><i class="ph-fill ph-robot text-2xl md:text-4xl"></i></div>
                        </div>
                        <div class="min-w-0 text-left md:text-center">
                            <h3 class="font-black text-lg md:text-2xl text-solar leading-tight m-0 mb-0.5 md:mb-2">Агент</h3>
                            <p class="text-[11px] md:text-base text-white/60 leading-snug m-0">роль, цель, промт, <br>контекст, инструменты</p>
                        </div>
                    </div>

                    <div class="flex items-center justify-start md:justify-center pl-[27px] md:pl-0">
                        <div class="w-4 h-[2px] md:w-full rotate-90 md:rotate-0 text-solar/60 a-flow"></div>
                    </div>

                    <div class="a-in a-in-3 bg-white border border-grayBase rounded-[18px] md:rounded-3xl px-2.5 py-3 md:px-5 md:py-7 flex flex-row md:flex-col items-center justify-start md:justify-center gap-2.5 md:gap-0 h-full">
                        <div class="relative w-12 h-12 md:w-24 md:h-24 shrink-0 md:mb-4 a-step">
                            <div class="absolute inset-0 rounded-full border-2 border-dashed border-solar/40 a-orbit"></div>
                            <div class="absolute inset-[13%] rounded-full bg-grayBase flex items-center justify-center text-black"><i class="ph-fill ph-shield-check text-2xl md:text-4xl"></i></div>
                        </div>
                        <div class="min-w-0 text-left md:text-center">
                            <h3 class="font-black text-lg md:text-2xl text-black leading-tight m-0 mb-0.5 md:mb-2">Эксплуатация</h3>
                            <p class="text-[11px] md:text-base text-black/55 leading-snug m-0">тесты, ограничения, <br>наблюдение, улучшение</p>
                        </div>
                    </div>
                </div>

                <!-- Петля «каждый день»: на ПК — скоба под рядом от центра третьей
                     карточки к центру первой; на телефоне — скоба справа от центра
                     нижней строки к центру верхней ((100%-32px)/6 = половина строки).
                     Стрелки в пилюле вращаются (a-orbit): цикл видно глазом —
                     владелец просил «всё анимированно». Сама пилюля не дышит:
                     «работает каждый день» — пусть не мигает (правка владельца) -->
                <div class="relative shrink-0 w-[110px] md:w-auto md:h-14 md:mx-[calc((100%-112px)/6)] md:mb-6 a-in a-in-4">
                    <div class="absolute left-0 top-[calc((100%-32px)/6)] bottom-[calc((100%-32px)/6)] w-1/2 md:w-full md:top-0 md:bottom-0 border-y-2 border-r-2 md:border-t-0 md:border-l-2 border-dashed border-solar/40 rounded-r-2xl md:rounded-tr-none md:rounded-b-3xl"></div>
                    <!-- Пилюля центруется флексом, а не translate: подгонщик меряет
                         чернила по offsetLeft, который сдвиг не видит, и считал бы,
                         что она торчит за правый край (телефон ужимался до 0.9).
                         На телефоне поля пилюли узкие (px-1): с px-2 «каждый день»
                         распирало её шире колонки, и она вставала в 3px от карточки
                         «Агент» — владелец: «блоки не стоят вплотную» -->
                    <div class="absolute inset-0 md:top-auto md:h-0 px-2 md:px-0 flex items-center justify-center">
                        <div class="bg-solar rounded-xl md:rounded-full px-1 py-2 md:px-5 md:py-2.5 flex flex-col md:flex-row items-center justify-center gap-0.5 md:gap-2 text-center" style="color:#111;-webkit-text-fill-color:#111">
                            <i class="ph-bold ph-arrows-clockwise text-lg md:text-2xl a-orbit"></i>
                            <p class="text-[11px] md:text-lg font-medium leading-tight m-0"><span class="whitespace-nowrap">работает</span> <span class="whitespace-nowrap">каждый день</span></p>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
