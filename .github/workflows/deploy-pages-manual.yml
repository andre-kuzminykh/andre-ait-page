# Запасной деплой Pages в обход штатного «pages build and deployment»:
# тот сегодня часами не получает раннеров и отменяется очередью (15 мин),
# а обычные workflow-джобы планируются мгновенно. Запускается ТОЛЬКО
# на каждый пуш в main (источник в Settings → Pages: «GitHub Actions»).
name: deploy-pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# cancel-in-progress:false — КРИТИЧНО. GitHub сегодня отдаёт события пуша
# с задержкой и НЕ по порядку: ран для более старого коммита создавался
# позже и своей отменой убивал уже стоявший в очереди ран с более свежим
# кодом. С false раны не убивают друг друга, а выполняются по очереди —
# последним применяется самый новый коммит (так же настроен официальный
# шаблон Pages от GitHub).
#
# Имя группы «pages-live» (было «pages»): во время сбоя 06.08 ран #4 завис
# в waiting навсегда и, держа слот старой группы, не пускал никого позади
# себя (ран #5 простоял pending 9 часов). Отменить #4 через API нельзя
# (403 у интеграции), поэтому новые раны уходят в свежую группу мимо
# зависшего. Сам #4 добить кнопкой Cancel на его странице.
concurrency:
  group: pages-live
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Закрытые модули (FR-SITE77): исходники 4–6 живут в репозитории — из
      # каркаса лекции 4 собирается лекция 3, и общие блоки сверяются тестами, —
      # но на сайт они не выкладываются. По их адресам отдаётся 404.html:
      # «Модуль N ещё закрыт». Открыть модуль = убрать его строку отсюда.
      - name: Сайт без закрытых модулей
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          tar --exclude=./.git --exclude=./.github \
              --exclude=./automation/4 \
              --exclude=./automation/5 \
              --exclude=./automation/6 \
              -cf - . | tar -xf - -C "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - id: deployment
        uses: actions/deploy-pages@v4
