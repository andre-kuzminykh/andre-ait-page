# Запасной деплой Pages в обход штатного «pages build and deployment»:
# тот сегодня часами не получает раннеров и отменяется очередью (15 мин),
# а обычные workflow-джобы планируются мгновенно. Запускается ТОЛЬКО
# на каждый пуш в main (источник в Settings → Pages: «GitHub Actions»).
name: deploy-pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-manual
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
